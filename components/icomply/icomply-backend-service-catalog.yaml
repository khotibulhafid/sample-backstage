---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: icomply-backend
  namespace: icomply
  description: IFG Life iComply - Quarkus backend service managing governance, risk, and compliance workflows, documents, and approvals.
  tags:
    - component
    - backend
    - service
    - icomply
    - quarkus
  links:
    - title: Source Repository
      url: https://code.ifg-life.id/projects/IFIC/repos/icomply-backend/browse
    - title: Docker Image
      url: docker://docker-icomply.artifact.ifg-life.id/icomply/icomply-backend
    - title: Deployment YAML (Env & Config)
      url: https://code.ifg-life.id/projects/IFDE/repos/ifgl-ls4h5-prd-prod-icomply-comply-prod/browse/deployment.yaml?at=refs%2Fheads%2Ficomply-backend
    - title: Base URL
      url: https://api-icomply.ifg-life.id
    - title: Liveness Endpoints
      url: http://localhost:8080/q/health/live
    - title: Readiness Endpoints
      url: http://localhost:8080/q/health/ready
    - title: Documentation
      url: https://code.ifg-life.id/projects/IFIC/repos/icomply-backend/browse/README.md
spec:
  type: REST
  owner: group:default/icomply
  system: system:icomply/icomply
  domain: domain:icomply/compliance
  lifecycle: production
  environments: prod
  language: java
  framework:
    - name: Quarkus
      version: 3.39.4
  auth:
    method: JWT
    notes: >
      Service uses SmallRye JWT Bearer token authentication
  secretType: Kubernetes Secret
  security:
    rotationPolicy: manual
  dependsOn: [
    resource:default/icomply-prd, #EKS
    resource:database/pg-icomply, #Database
    resource:storage/s3-icomply, #Storage
    component:icomply/ifglife-wrapper #Integration Wrapper
  ]
  runtime:
    cluster: icomply-prd
    namespace: icomply
  providesApis: [
    api:icomply/icomply-backend-api
  ]
  consumesApis: [
    api:icomply/ifglife-wrapper-api
  ]
