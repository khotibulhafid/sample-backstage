---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: acquirer-ifgl-network-service
  namespace: lifenet-acquirer
  description: The placeholder for all backend Lifenet Portal for Lifenet Tribe
  tags:
    - backend
    - service
    - lifenet-acquirer
    - lifenet
    - admin
  links:
    - title: Source Repository
      url: https://code.ifg-life.id/projects/ILEN/repos/acquirer-ifgl-network-service/browse
#    - title: Monitoring / Logs (Datadog)
#      url: #Need to get value
    - title: Deployment (ArgoCD)
      url: https://deploy.ifg-life.id/applications/lifenet-acquirer-release-acquirer-ifgl-network-service
    - title: Docker Image
      url: docker://docker-hospital.artifact.ifg-life.id/lifenet/acquirer-ifgl-network-service-uat
    - title: Deployment YAML (Env & Config)
      url: https://code.ifg-life.id/projects/IFDE/repos/ifgl-tu9b2-prd-prod-lifenet-lifenet-acquirer-release/browse?at=refs%2Fheads%2Facquirer-ifgl-network-service
    - title: Base URL
      url: https://net.life.id
    - title: Liveness Endpoints
      url: http://acquirer-ifgl-network-service.lifenet-admin.svc:8080/api/q/health/live
    - title: Documentation
      url: https://code.ifg-life.id/projects/ILEN/repos/acquirer-ifgl-network-service/browse/README.md
spec:
  type: REST
  lifecycle: production
  environments: prod
  owner: group:channel/lifenet-acquirer
  system: system:channel/lifenet-acquirer-system
  domain: domain:lifenet/lifenet
  language: java
  framework:
    - name: Quarkus
    - version: 3.19.4
  auth:
    method: API Key
    notes: >
      Service uses Kong API Key for authorization
  secretType: Kubernetes Secret
  security:
    rotationPolicy: manual
  runtime:
    cluster: lifenet-prd
    namespace: lifenet-admin
  dependsOn: [resource:lifenet-prd]
  providesApis: [lifenet-acquirer/acquirer-ifgl-network-service-api]
  consumesApis: [
    lifenet-network/acquirer-ifgl-wrapper-service-api,
    ao-product-engine/notification-service-api
  ]
  limits: 'default kong'