---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: provider-service
  namespace: lifenet-acquirer
  description: Provider Maintainer including group and user and role service for Lifenet System
  tags:
    - backend
    - service
    - lifenet-acquirer
    - lifenet
  links:
    - title: Source Repository
      url: https://code.ifg-life.id/projects/ILEN/repos/provider-service/browse
#    - title: Monitoring / Logs (Datadog)
#      url: #Need to get value
    - title: Deployment (ArgoCD)
      url: https://deploy.ifg-life.id/applications/lifenet-acquirer-release-provider-service
    - title: Docker Image
      url: docker-hospital.artifact.ifg-life.id/lifenet/provider-service-uat
    - title: Deployment YAML (Env & Config)
      url: https://code.ifg-life.id/projects/IFDE/repos/ifgl-tu9b2-prd-prod-lifenet-lifenet-acquirer-release/browse?at=refs%2Fheads%2Fprovider-service
    - title: Base URL
      url: https://net-admin.life.id
    - title: Liveness Endpoints
      url: http://provider-service.lifenet-admin.svc:8080/api/q/health/live
    - title: Documentation
      url: https://code.ifg-life.id/projects/ILEN/repos/provider-service/browse/README.md
spec:
  type: REST
  lifecycle: production
  owner: group:channel/lifenet-acquirer
  system: system:channel/lifenet-acquirer-system
  domain: domain:lifenet/lifenet
  language: java
  framework:
    - name: Quarkus
    - version: 3.19.4
  auth:
    method: API Key
    notes: >
      Service uses Kong API Key for authorization
  secretType: Kubernetes Secret
  security:
    rotationPolicy: manual
  runtime:
    cluster: lifenet-prd
    namespace: lifenet-admin
#  subcomponentOf: lifenet-admin-backend
  dependsOn: [resource:lifenet-prd]
  providesApis: [provider-service-api]
  consumesApis: [lifenet-network/provider-mapping-network-service-api, storage-service-api, ao-product-engine/notification-service-component-api]
  limits: 'default kong'