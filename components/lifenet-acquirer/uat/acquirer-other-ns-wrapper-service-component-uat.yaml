---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: acquirer-other-ns-wrapper-service-uat
  namespace: lifenet-acquirer
  description: wrapper to connect Lifenet Admin Front End with other service from other namespace for Lifenet System
  tags:
  - backend
  - service
  - lifenet-acquirer
  - lifenet
  - uat
  links:
    - title: Source Repository
      url: https://code.ifg-life.id/projects/ILEN/repos/acquirer-other-ns-wrapper-service/browse?at=refs%2Fheads%2Fuat
#    - title: Monitoring / Logs (Datadog)
#      url: #Need to get value
    - title: Deployment (ArgoCD)
      url: https://deploy.ifg-life.id/applications/lifenet-acquirer-uat-acquirer-other-ns-wrapper-service
    - title: Docker Image
      url: docker://docker-hospital.artifact.ifg-life.id/lifenet/acquirer-other-ns-wrapper-service-uat
    - title: Deployment YAML (Env & Config)
      url: https://code.ifg-life.id/projects/IFDE/repos/ifgl-7lddu-nprd-uat-lifenet-lifenet-acquirer-uat/browse?at=refs%2Fheads%2Facquirer-other-ns-wrapper-service
    - title: Base URL
      url: #Empty
    - title: Liveness Endpoints
      url: /api/q/health/live
    - title: Documentation
      url: https://code.ifg-life.id/projects/ILEN/repos/acquirer-other-ns-wrapper-service/browse/README.md?at=refs%2Fheads%2Fuat
