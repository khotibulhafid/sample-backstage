  system: system:channel/lifenet-acquirer-system
  domain: domain:lifenet/lifenet
  language: java
  framework:
    - name: Quarkus
    - version: 3.19.4
  auth:
    method: API Key
    notes: >
      Service uses Kong API Key for authorization
  secretType: Kubernetes Secret
  security:
    rotationPolicy: manual
  runtime:
    cluster: lifenet-prd
    namespace: lifenet-admin
#  subcomponentOf: lifenet-admin-backend
  dependsOn: #TODO need to be updated?
  providesApis: [lifenet-acquirer/acquirer-other-ns-wrapper-service-api-uat]
  consumesApis: [
    lifenet-network/provider-mapping-network-service-api-uat,
    lifenet-issuer/issuer-ifgl-case-monitoring-service-api-uat
  ]
  limits: 'default kong'