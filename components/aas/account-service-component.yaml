---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: account-service
  namespace: acct-mgmt-system
  description: service to manage account information and monitor balances (real, locked, and available). It supports single or bulk updates for account data and interest rates.
  tags:
    - component
    - backend
    - service
    - account
    - quarkus
  links:
    - title: Source Repository
      url: https://code.ifg-life.id/projects/IFCA/repos/account-service/browse
    - title: Monitoring / Logs (Datadog)
      url: https://app.datadoghq.com/apm/entity/service:account-service
    - title: Deployment (ArgoCD)
      url: https://deploy.ifg-life.id/applications/acct-mgmt-system-release-account-service
    - title: Docker Image
      url: docker://docker-aas.artifact.ifg-life.id/acct-mgmt-system/account-service
    - title: Deployment YAML (Env & Config)
      url: https://code.ifg-life.id/projects/IFDE/repos/ifgl-1awvh-prd-automation-prd-acct-mgmt-system-release/browse/deployment.yaml?at=refs%2Fheads%2Faccount-service
    - title: Base URL
      url: https://api-aas.ifg-life.id
    - title: Liveness Endpoints
      url: http://localhost:8080/q/health/live
    - title: Readiness Endpoints
      url: http://localhost:8080/q/health/ready
    - title: Documentation
      url: https://code.ifg-life.id/projects/IFCA/repos/account-service/browse/README.md
spec:
  type: REST
  owner: group:core/aas
  system: system:core/account-administration-system
  domain: domain:core/core-business
  lifecycle: production
  environments: prod
  language: java
  framework:
    - name: Quarkus
      version: 3.26.2
  auth:
    method: API Key
    notes: >
      Service uses Kong API Key for authorization
  secretType: Kubernetes Secret
  security:
    rotationPolicy: manual
  dependsOn: [
    resource:default/prd-automation, #EKS
    resource:infra/1awvh-prd-prod-automation-az2, #Cluster
    resource:database/pg-core, #Database
    resource:aas/kong #Gateway
  ]
  runtime:
    cluster: 1awvh-prd-prod-automation-az2
    namespace: acct-mgmt-system
  providesApis: [
    api:acct-mgmt-system/account-service-api
  ]
  jenis_layanan: "Layanan Utama"
  consumesApis: []
  limits: 'default kong'
