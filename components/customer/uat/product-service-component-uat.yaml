---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: product-service-uat
  namespace: customer
  description: The placeholder for all backend service for customerapps
  tags:
  - backend
  - service
  - lifebyifg
  - uat
spec:
  type: service
  lifecycle: experimental
  owner: default/lifebyifg
  system: lifebyifg
  providesApis: [product-service-api]
  dependsOn: [resource:default/ifgl-bvl19-prd-prod-customer-customerapps, resource:default/kafka]
  consumesApis: [ customer/user-wrapper-service-api-uat, customer/event-service-api-uat, customer/policy-service-api-uat, customer/partner-service-api-uat, customer/transaction-service-api-uat, customer/storage-service-api-uat, customer/referral-service-api-uat ]
