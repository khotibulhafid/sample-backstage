---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: individu-customer-360-wrapper
  namespace: lifeforce-individu
  description: Wrapper for customer 360 API
  title: Individu Customer 360 Wrapper
  tags:
    - component
    - backend
    - service
    - lifeforce
    - lifeforce-individu
    - quarkus
links:
    - title: Source Repository
      url: https://code.ifg-life.id/projects/ILLF/repos/individu-customer-360-wrapper/browse
    - title: Monitoring / Logs (Datadog)
      url: https://app.datadoghq.com/apm/entity/service:lifeforceindv-customer-360-wrapper
    - title: Deployment (ArgoCD)
      url: https://deploy.ifg-life.id/applications/lifeforce-individu-release-customer-360-wrapper
    - title: Docker Image
      url: docker://docker-lifeforce.artifact.ifg-life.id/lifeforce-individu/customer-360-wrapper-release:15
    - title: Deployment YAML (Env & Config)
      url: https://code.ifg-life.id/projects/IFDE/repos/ifgl-yu30h-prd-prod-lifeforce-lifeforce-individu-release/browse/deployment.yaml?at=refs%2Fheads%2Fcustomer-360-wrapper
    - title: Base URL
      url: https://force.life.id
    - title: Liveness Endpoints
      url: http://customer-360-wrapper.lifeforce-individu.svc:8080/api/q/health/live
    - title: Readiness Endpoints
      url: http://customer-360-wrapper.lifeforce-individu.svc:8080/api/q/health/ready
    - title: Documentation
      url: https://code.ifg-life.id/projects/ILLF/repos/individu-customer-360-wrapper/browse/README.md
spec:
  type: REST
  owner: group:channel/lifeforce-individu
  system: system:channel/lifeforce-individual-system
  domain: domain:channel/channel-platform
  lifecycle: production
  environments: prod
  language: java
  framework:
    - name: Quarkus
    - version: 3.24.5
  auth:
    method: API Key
    notes: >
      Service uses Kong API Key for authorization
  secretType: Kubernetes Secret
  security:
    rotationPolicy: manual
  dependsOn: [
    resource:default/prd-lifeforce, #EKS 
    resource:infra/lifeforce-prd, #Cluster
    resource:lifeforce/kong #Gateway
  ]
  runtime:
    cluster: lifeforce-prd
    namespace: lifeforce-individu
  providesApis: [lifeforce-individu/individu-customer-360-wrapper-api]
  consumeApis: [data/customer-service-api]
  limits: 'default kong'
