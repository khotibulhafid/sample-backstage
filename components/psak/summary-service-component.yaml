apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: summary-service-component
  namespace: psak
  description: Summary service for get expected cashflow from GBQ
  tags:
    - component
    - backend
    - service
    - psak
    - uat
spec:
  type: service
  lifecycle: production
  owner: default/psak
  system: psak
  dependsOn: [
    resource:default/cluster-psak-prd, #Cluster
    resource:default/eks-psak-prd, #EKS
    resource:default/psak, #Namespace
    resource:psak/kong,
    resource:psak/konga,
    resource:default/mongo
  ]
  consumesApis: [ ]
  providesApis: [ summary-service-api ]
