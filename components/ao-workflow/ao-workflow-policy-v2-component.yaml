---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ao-workflow-policy-v2
  namespace: ao-workflow
  description: The workflow policy service v2 is replication from workflow policy service in old cluster
  tags:
  - backend
  - service
  - policy
  - ps
  - workflow
  - quarkus
  links:
    - title: Source Repository
      url: https://code.ifg-life.id/projects/IFAO/repos/ao-workflow-policy-v2/browse
#    - title: Monitoring / Logs (Datadog)
#      url: "-"
#    - title: Deployment (ArgoCD)
#      url: "-"
    - title: Docker Image
      url: docker://docker-automation-operation.artifact.ifg-life.id/ao-workflow/backend-service/policy-workflow-v2-release:6
    - title: Deployment YAML (Env & Config)
      url: https://code.ifg-life.id/projects/IFDE/repos/ifgl-1awvh-prd-prod-automation-ao-workflow-release/browse?at=refs%2Fheads%2Fao-workflow-policy-v2
    - title: Liveness Endpoints
      url: http://ao-workflow-policy-v2:8093/q/health/live
    - title: Readiness Endpoints
      url: http://ao-workflow-policy-v2:8093/q/health/ready
    - title: Documentation
      url: https://code.ifg-life.id/projects/IFAO/repos/ao-workflow-policy-v2/browse/README.md
    - title: Base Url
      url: http://ao-workflow-policy-v2:8093
spec:
  type: workflow
  owner: group:automation/policy-squad
  system: system:automation/policy-automation-system
  domain: domain:automation/process-automation
  lifecycle: deprecated
  environment: prod
  language: java
  framework:
    - name: Quarkus
    - version: 2.16.12.Final
  workflow:
    version: 1.44.1.Final
  auth:
    method: none
  secretType: Kubernetes Secret
  security:
    rotationPolicy: manual
  runtime:
    cluster: 1awvh-prd-prod-automation-az2
    namespace: ao-workflow
  dependsOn: [
    resource:default/prd-automation, #EKS
    resource:infra/1awvh-prd-prod-automation-az2, #Cluster
    resource:default/kafka, #Database
    resource:ao-kong/kong #Gateway
  ]
  providesApis: [ ao-workflow-policy-v2-api ]
  consumesApis: [
    ao-product-engine/notification-service-api,
    ao-product-engine/product-config-service-api,
    ao-new-business/billing-service-api,
    ao-new-business/policy-service-v2-api,
    ao-workflow/ao-workflow-nb-wrapper-api,
    ao-workflow/ao-workflow-fraud-wrapper-api,
    customer/product-service-api,
    ifgid/ekyc-service-api
  ]
  limits: '-'