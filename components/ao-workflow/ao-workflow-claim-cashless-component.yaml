---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ao-workflow-claim-cashless
  namespace: ao-workflow
  description: The claim workflow service for automation claim cashless service
  tags:
  - backend
  - service
  - claim
  - workflow
  - cashless
  - wrapper
  - quarkus
  links:
    - title: Source Repository
      url: https://code.ifg-life.id/projects/IFAO/repos/ao-workflow-claim-cashless/browse
    - title: Deployment (ArgoCD)
      url: https://deploy.ifg-life.id/applications/dev-workflow-claim-development-claim-cashless-workflow
    - title: Docker Image
      url: docker://docker-automation-operation.artifact.ifg-life.id/ao-workflow-version2/backend-service/claim-cashless-workflow-development
    - title: Deployment YAML (Env & Config)
      url: https://code.ifg-life.id/projects/IFDE/repos/ifgl-jg2mq-nprd-dev-legacy-ao-workflow-claim-dev/browse/deployment.yaml?at=refs%2Fheads%2Fclaim-cashless-workflow
    - title: Base URL
      url: https://api-automation-v2.ifg-life.id
    - title: Liveness Endpoints
      url: https://localhost:8080/q/health/live
    - title: Readiness Endpoints
      url: https://localhost:8080/q/health/ready
    - title: Kafka Topic List
      url: https://code.ifg-life.id/projects/IFAO/repos/ao-workflow-claim-cashless/browse/kafka_topic_documentation.md
    - title: Sample Kafka Message
      url: https://code.ifg-life.id/projects/IFAO/repos/ao-workflow-claim-cashless/browse/kafka_topic_documentation.md
    - title: Documentation
      url: https://code.ifg-life.id/projects/IFAO/repos/ao-workflow-claim-cashless/browse/README.md
spec:
  type: workflow
  owner: group:automation/claim
  system: system:automation/claim-automation-system
  domain: domain:automation/process-automation
  lifecycle: experimental
  environments: dev
  language: java
  framework:
    - name: Quarkus
    - version: 3.8.6
  workflow:
    version: 2.44.0.Alpha
  auth:
    method: API Key
    notes: >
      Service uses Kong API Key for authorization
  secretType: Kubernetes Secret
  security:
    rotationPolicy: manual
  dependsOn: [
    resource:default/prd-automation, #EKS 
    resource:infra/1awvh-prd-prod-automation-az2, #Cluster
    resource:infra/kafka,
    resource:automation/keycloak,
    resource:claim/data-index,
    resource:claim/infinispan,
    resource:claim/kogito-management-console,
    resource:claim/kogito-task-console
  ]
  runtime:
    cluster: 1awvh-prd-prod-automation-az2
    namespace: dev-workflow-claim
  providesApis: [ao-workflow-claim-cashless-api]
  consumeApis: [ao-workflow-claim-wrapper-api]
  limits: '-'