---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ao-workflow-nb-wrapper
  namespace: ao-workflow
  description: The workflow wrapper nb service for automation nb proses service
  tags:
    - service
    - quarkus
    - backend
    - nb
  links:
    - title: Source Repository
      url: https://code.ifg-life.id/projects/IFAO/repos/ao-workflow-nb-wrapper-version2/browse
    - title: Monitoring / Logs (Datadog)
      url: https://app.datadoghq.com/apm/entity/service:ao-workflow-nb-wrapper
    - title: Deployment (ArgoCD)
      url: https://deploy.ifg-life.id/applications/workflow-nb-release-nb-wrapper-workflow
    - title: Docker Image
      url: docker://docker-automation-operation.artifact.ifg-life.id/ao-workflow-version2/backend-service/ao-workflow-nb-wrapper-release:21
    - title: Deployment YAML (Env & Config)
      url: https://code.ifg-life.id/projects/IFDE/repos/ifgl-l4qdb-prd-prod-legacy-ao-workflow-nb-release/browse?at=refs%2Fheads%2Fnb-wrapper-workflow
    - title: Liveness Endpoints
      url: https://ao-workflow-nb-wrapper:8091/q/health/live
    - title: Readiness Endpoints
      url: https://ao-workflow-nb-wrapper:8091/q/health/ready
    - title: Documentation
      url: https://code.ifg-life.id/projects/IFAO/repos/ao-workflow-nb-wrapper-version2/browse/README.md
    - title: Base URL
      url: https://api-automation-v2.ifg-life.id
    - title: Kafka Topic List
      url: https://code.ifg-life.id/projects/IFAO/repos/ao-workflow-nb-wrapper-version2/browse/kafka_topic_documentation.md
    - title: Sample Kafka Message
      url: https://code.ifg-life.id/projects/IFAO/repos/ao-workflow-nb-wrapper-version2/browse/kafka_topic_documentation.md
spec:
  type: workflow
  lifecycle: production
  owner: group:automation/new-business
  system: system:automation/new-business-automation-system
  domain: domain:automation/process-automation
  environments: prod
  language: java
  framework:
    - name: Quarkus
    - version: 3.30.3
  secretType: Kubernetes Secret
  security:
    rotationPolicy: manual
  runtime:
    cluster: cluster-automation-prd
    namespace: workflow-nb
  consumeApis: [ ]
  usesLibraries:
    - name: "kogito"
      implemented: True
  auth:
    method: apiKey
  limits: "-"
#  subcomponentOf: ao-workflow-nb-wrapper-backend
  dependsOn: [
    resource:infra/eks-automation-core-prd, # EKS
    resource:infra/automation-core-prd, # Cluster
    resource:infra/kafka,
    resource:aowf/kong
  ]
  providesApis: [ao-workflow-nb-wrapper-api]
  consumesApis: [ao-product-engine/notification-service-api,ifgid/ekyc-service-api,ao-workflow-nb-api]