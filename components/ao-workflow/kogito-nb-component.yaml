---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: kogito-nb
  namespace: workflow-nb
  description: The kogito nb service for automation nb proses service
  tags:
    - workflow
    - quarkus
    - nb
  links:
    - title: Source Repository
      url: https://code.ifg-life.id/projects/IFAO/repos/kogito-nb/browse
#    - title: Monitoring / Logs (Datadog)
#      url: https://app.datadoghq.com/apm/entity/service:infinispan-nb
    - title: Deployment (ArgoCD)
      url: https://deploy.ifg-life.id/applications/workflow-nb-release-kogito
#    - title: Docker Image
#      url: docker://docker-automation-operation.artifact.ifg-life.id/ao-workflow-version2/backend-service/nb-workflow-release:25
    - title: Deployment YAML (Env & Config)
      url: https://code.ifg-life.id/projects/IFDE/repos/ifgl-l4qdb-prd-prod-legacy-ao-workflow-nb-release/browse?at=refs%2Fheads%2Fkogito-nb
#    - title: Liveness Endpoints
#      url: https://infinispan-nb:8091/q/health/live
#    - title: Readiness Endpoints
#      url: https://infinispan-nb:8091/q/health/ready
#    - title: Documentation
#      url: https://code.ifg-life.id/projects/IFAO/repos/ao-workflow-nb-version2/browse/README.md
#    - title: Base URL
#      url: https://ao-workflow-nb:8091
spec:
  type: service
  lifecycle: production
  owner: group:automation/new-business
  system: system:automation/new-business-automation-system
  domain: domain:automation/process-automation
  environments: prod
  language: java
  framework:
    - name: Quarkus
    - version: 3.8.6.1
  secretType: Kubernetes Secret
  security:
    rotationPolicy: manual
  runtime:
    cluster: cluster-automation-prd
    namespace: workflow-nb
  workflow:
    version: 2.44.0.Alpha
  consumeApis: [ ]
  usesLibraries:
    - name: "infinispan"
      implemented: True
    - name: "dataindex"
      implemented: True
    - name: "management-console"
      implemented: True
    - name: "task-console"
      implemented: True
  auth:
    method: none
  limits: "-"
#  subcomponentOf: ao-workflow-nb-backend
  dependsOn: [
    resource:infra/kafka,
    resource:database/infinispan,
    resource:infra/keycloak,
    resource:infra/EFS,
  ]
  providesApis: [kogito-nb-api]
  consumesApis: [ao-product-engine/notification-service-api,ao-product-engine/product-config-service-api,ifgid/ekyc-service-api,ao-new-business/billing-service-api,ao-new-business/journal-service-api,ao-new-business/new-business-service-v2-api,ao-new-business/policy-service-v2-api,ao-new-business/proposal-service-v2-api,ao-new-business/underwriting-service-api,ao-workflow/ao-workflow-fraud-wrapper-api,ao-workflow/ao-workflow-claim-wrapper-api,customer/product-service-api]