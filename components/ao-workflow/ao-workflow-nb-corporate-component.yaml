---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ao-workflow-nb-corporate
  namespace: workflow-nb
  description: The workflow nb corporate service for automation nb proses service
  tags:
    - workflow
    - quarkus
    - backend
    - nb
  links:
    - title: Source Repository
      url: https://code.ifg-life.id/projects/IFAO/repos/ao-workflow-nb-corporate-version2/browse
    - title: Monitoring / Logs (Datadog)
      url: https://app.datadoghq.com/apm/entity/service:ao-workflow-nb-corporate
    - title: Deployment (ArgoCD)
      url: https://deploy.ifg-life.id/applications/workflow-nb-release-nb-corporate-workflow
    - title: Docker Image
      url: docker://docker-automation-operation.artifact.ifg-life.id/ao-workflow-version2/backend-service/nb-corporate-workflow-release:14
    - title: Deployment YAML (Env & Config)
      url: https://code.ifg-life.id/projects/IFDE/repos/ifgl-l4qdb-prd-prod-legacy-ao-workflow-nb-release/browse?at=refs%2Fheads%2Fnb-corporate-workflow
    - title: Liveness Endpoints
      url: https://ao-workflow-nb-corporate:8091/q/health/live
    - title: Readiness Endpoints
      url: https://ao-workflow-nb-corporate:8091/q/health/ready
    - title: Documentation
      url: https://code.ifg-life.id/projects/IFAO/repos/ao-workflow-nb-corporate-version2/browse/README.md
    - title: Base URL
      url: https://ao-workflow-nb-corporate:8091
    - title: Kafka Topic List
      url: https://code.ifg-life.id/projects/IFAO/repos/ao-workflow-nb-corporate-version2/browse/kafka_topic_documentation.md
    - title: Sample Kafka Message
      url: https://code.ifg-life.id/projects/IFAO/repos/ao-workflow-nb-corporate-version2/browse/kafka_topic_documentation.md
spec:
  type: workflow
  lifecycle: production
  owner: group:automation/new-business
  system: system:automation/new-business-automation-system
  domain: domain:automation/process-automation
  environments: prod
  language: java
  framework:
    - name: Quarkus
    - version: 3.8.6.1
  secretType: Kubernetes Secret
  security:
    rotationPolicy: manual
  runtime:
    cluster: cluster-automation-prd
    namespace: workflow-nb-corporate
  workflow:
    version: 2.44.0.Alpha
  consumeApis: [ ]
  usesLibraries:
    - name: "kogito"
      implemented: True
  auth:
    method: none
  limits: "-"
#  subcomponentOf: ao-workflow-nb-backend
  dependsOn: [
    resource:infra/eks-automation-core-prd, # EKS
    resource:infra/automation-core-prd, # Cluster
    resource:infra/kafka,
    resource:automation/keycloak,
    resource:new-business/data-index,
    resource:new-business/infinispan,
    resource:new-business/kogito-management-console,
    resource:new-business/kogito-task-console
  ]
  providesApis: [ao-workflow-nb-corporate-api]
  consumesApis: [
    ao-product-engine/notification-service-api,
    ao-product-engine/product-config-service-api,
    ifgid/ekyc-service-api,
    ao-new-business/billing-service-api,
    ao-new-business/journal-service-api,
    ao-new-business/new-business-service-v2-api,
    ao-new-business/policy-service-v2-api,
    ao-new-business/proposal-service-v2-api,
    ao-new-business/underwriting-service-api,
    ao-workflow/ao-workflow-fraud-wrapper-api,
    ao-workflow/ao-workflow-claim-wrapper-api,
    customer/product-service-api
