---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: core-services
  namespace: payment
  description: Core service of Payment, used to access database and process payments
  tags:
    - component
    - backend
    - service
    - quarkus
    - payment
  links:
    - title: Source Repository
      url: https://code.ifg-life.id/projects/IFPY/repos/core-services/browse
    - title: Monitoring / Logs (Datadog)
      url: https://app.datadoghq.com/apm/entity/service:payment-core-service
    - title: Deployment (ArgoCD)
      url: https://deploy.ifg-life.id/applications/payment-release-core-service
    - title: Docker Image
      url: docker://docker-paymenthub.artifact.ifg-life.id/paymenthub/service/core-service-release:159
    - title: Deployment YAML (Env & Config)
      url: https://code.ifg-life.id/projects/IFDE/repos/ifgl-8spdr-prd-prod-payment-payment-release/browse?at=refs%2Fheads%2Fcore-service
    - title: Base URL
      url: http://core-service:8080
    - title: Liveness Endpoints
      url: http://core-service:8080/q/health/live
    - title: Readiness Endpoints
      url: http://core-service:8080/q/health/ready
    - title: Swagger / Open API
      url: https://code.ifg-life.id/projects/IFSC/repos/ifpy---payment/browse/core-services
spec:
  type: REST
  owner: group:default/ifgpay
  system: system:payment/ifgpay
  domain: domain:payment/ifgpay
  lifecycle: production
  environments: prod
  language: java
  framework:
    - name: Quarkus
      version: 3.29.0
  auth:
    method: API Key
    notes: >
      Service uses Kong API Key for authorization
  secretType: Kubernetes Secret
  security:
    rotationPolicy: manual
  dependsOn: [
    resource:database/pg-payment,
    resource:payment/kafka
  ]
  runtime:
    cluster: 8spdr
    namespace: payment
  consumesApis: [
    gateway-bcheck-api,
    gateway-biller-api,
    gateway-bri-api,
    gateway-btn-api,
    gateway-cts-api,
    gateway-doku-api,
    gateway-frontend-api,
    gateway-mandiri-api,
    gateway-midtrans-api,
    gateway-pospay-api,
    gateway-xendit-api,
    gateway-yokke-api,
    recurring-service-api,
    inquiry-core-service-api
  ]
  providesApis: [
    core-services-api
  ]
  limits: 'default kong'
