---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: dashboard-service
  namespace: payment
  description: Dashboard Service is a backend service that provides the APIs used by the front end to display the payment dashboard. It handles requests from the user interface and returns the data needed to show payment-related information on the dashboard.
  tags:
    - component
    - backend
    - service
    - payment
    - quarkus
  links:
    - title: Source Repository
      url: https://code.ifg-life.id/projects/IFPY/repos/dashboard-service/browse
    - title: Monitoring / Logs (Datadog)
      url: https://app.datadoghq.com/apm/entity/service:payment-dashboard-service
    - title: Deployment (ArgoCD)
      url: https://deploy.ifg-life.id/applications/payment-release-dashboard-service
    - title: Docker Image
      url: docker-paymenthub.artifact.ifg-life.id/paymenthub/service/dashboard-service-release:5
    - title: Deployment YAML (Env & Config)
      url: https://code.ifg-life.id/projects/IFDE/repos/ifgl-8spdr-prd-prod-payment-payment-release/browse?at=refs%2Fheads%2Fdashboard-service
    - title: Base URL
      url: http://dashboard-service:8080
    - title: Liveness Endpoints
      url: http://dashboard-service:8080/q/health/live
    - title: Readiness Endpoints
      url: http://dashboard-service:8080/q/health/ready
    - title: Swagger / Open API
      url: https://code.ifg-life.id/projects/IFSC/repos/ifpy---payment/browse/dashboard-service
spec:
  type: REST
  owner: group:default/ifgpay
  system: system:payment/ifgpay
  domain: domain:payment/ifgpay
  lifecycle: production
  environments: prod
  language: java
  framework:
    - name: Quarkus
      version: 3.29.0
  auth:
    method: JWT
    notes: >
      Service uses JWT for authorization
  secretType: Kubernetes Secret
  security:
    rotationPolicy: manual
  dependsOn: [
    resource:database/pg-payment,
    resource:payment/kafka
  ]
  runtime:
    cluster: 8spdr
    namespace: payment
  consumesApis: [
    gateway-cts-api
  ]
  providesApis: [
    dashboard-service-api
  ]
  limits: 'default kong'