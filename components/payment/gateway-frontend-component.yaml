---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: gateway-frontend
  namespace: payment
  description: Gateway frontend is a backend service that provides APIs for front-end clients (e.g. mobile applications, pwa). It delivers the data and functionality needed to support user-facing experiences.
  tags:
    - component
    - backend
    - service
    - payment
    - quarkus
  links:
    - title: Source Repository
      url: https://code.ifg-life.id/projects/IFPY/repos/gateway-frontend/browse
    - title: Monitoring / Logs (Datadog)
      url: https://app.datadoghq.com/apm/entity/service:payment-gateway-frontend
    - title: Deployment (ArgoCD)
      url: https://deploy.ifg-life.id/applications/payment-release-gateway-frontend
    - title: Docker Image
      url: docker-paymenthub.artifact.ifg-life.id/paymenthub/service/gateway-frontend-release:34
    - title: Deployment YAML (Env & Config)
      url: https://code.ifg-life.id/projects/IFDE/repos/ifgl-8spdr-prd-prod-payment-payment-release/browse?at=refs%2Fheads%2Fgateway-frontend
    - title: Base URL
      url: http://gateway-frontend:8080
    - title: Liveness Endpoints
      url: http://gateway-frontend/q/health/live
    - title: Readiness Endpoints
      url: http://gateway-frontend/q/health/ready
    - title: Swagger / Open API
      url: https://code.ifg-life.id/projects/IFSC/repos/ifpy---payment/browse/gateway-frontend
spec:
  type: REST
  owner: group:default/ifgpay
  system: system:payment/ifgpay
  domain: domain:payment/ifgpay
  lifecycle: production
  environments: prod
  language: java
  framework:
    - name: Quarkus
      version: 3.29.0
  auth:
    method: JWT
    notes: >
      Service uses JWT for authorization
  secretType: Kubernetes Secret
  security:
    rotationPolicy: manual
  dependsOn: [
    resource:payment/kafka
  ]
  runtime:
    cluster: 8spdr
    namespace: payment
  consumesApis: [
    gateway-cts-api,
    core-services-api,
    gateway-biller-api,
    gateway-bcheck-api
  ]
  providesApis: [
    gateway-frontend-api
  ]
  limits: 'default kong'