---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: gateway-workflow
  namespace: payment
  description: Gateway to communicate with Workflow Service
  tags:
  - component
  - backend
  - service
  - payment
  links:
    - title: Source Repository
      url: https://code.ifg-life.id/projects/IFPY/repos/gateway-workflow/browse
    - title: Monitoring / Logs (Datadog)
      url: https://app.datadoghq.com/apm/entity/service:payment-gateway-workflow
    - title: Deployment (ArgoCD)
      url: https://deploy.ifg-life.id/applications/payment-release-gateway-workflow
    - title: Docker Image
      url: docker://docker-paymenthub.artifact.ifg-life.id/paymenthub/service/gateway-workflow-release:4
    - title: Deployment YAML (Env & Config)
      url: https://code.ifg-life.id/projects/IFDE/repos/ifgl-8spdr-prd-prod-payment-payment-release/browse?at=gateway-workflow
    - title: Base URL
      url: http://gateway-workflow:8080
    - title: Liveness Endpoints
      url: http://gateway-workflow:8080/q/health/live
    - title: Readiness Endpoints
      url: http://gateway-workflow:8080/q/health/ready
    - title: Swagger / Open API
      url: https://code.ifg-life.id/projects/IFSC/repos/ifpy---payment/browse/gateway-workflow
spec:
  type: REST
  owner: group:default/ifgpay
  system: system:payment/ifgpay
  domain: domain:payment/ifgpay
  lifecycle: production
  environments: prod
  language: java
  framework:
    - name: Quarkus
      version: 3.23.3
  auth:
    method: API Key
    notes: >
      Service uses Kong API Key for authorization
  secretType: Kubernetes Secret
  security:
    rotationPolicy: manual
  dependsOn: [
    resource:payment/kong
  ]
  runtime:
    cluster: 8spdr
    namespace: payment
  consumesApis: [
    core-service-api
  ]
  providesApis: [ gateway-workflow-api ]
  limits: 'default kong'