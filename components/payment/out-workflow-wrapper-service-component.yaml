---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: out-workflow-wrapper-service
  namespace: payment
  description: Out Workflow Wrapper Service is a backend service that connects the workflow service with other services.
  tags:
    - component
    - backend
    - service
    - quarkus
    - payment
    - workflow
  links:
    - title: Source Repository
      url: https://code.ifg-life.id/projects/IFPY/repos/out-workflow-wrapper-service
    - title: Monitoring / Logs (Datadog)
      url: https://app.datadoghq.com/apm/entity/service%3Apayment-out-workflow-wrapper-service
    - title: Deployment (ArgoCD)
      url: https://deploy.ifg-life.id/applications/workflow-payment-release-out-workflow-wrapper-service
    - title: Docker Image
      url: docker-paymenthub.artifact.ifg-life.id/paymenthub/service/out-workflow-wrapper-service-release:10
    - title: Deployment YAML (Env & Config)
      url: https://code.ifg-life.id/projects/IFDE/repos/ifgl-8spdr-prd-prod-payment-payment-release/browse?at=refs%2Fheads%2Fout-workflow-wrapper-service
    - title: Base URL
      url: http://out-workflow-wrapper-service:8080
    - title: Liveness Endpoints
      url: http://out-workflow-wrapper-service:8080/q/health/live
    - title: Readiness Endpoints
      url: http://out-workflow-wrapper-service:8080/q/health/ready
    - title: Swagger / Open API
      url: https://code.ifg-life.id/projects/IFSC/repos/ifpy---payment/browse/out-workflow-wrapper-service
spec:
  type: REST
  owner: group:default/ifgpay
  system: system:payment/ifgpay
  domain: domain:payment/ifgpay
  lifecycle: production
  environments: prod
  language: java
  framework:
    - name: Quarkus
      version: 3.23.4
  auth:
    method: API Key
    notes: >
      Service uses Kong API Key for authorization
  secretType: Kubernetes Secret
  security:
    rotationPolicy: manual
  dependsOn: [
    resource:payment/kafka
  ]
  runtime:
    cluster: 8spdr
    namespace: payment
  consumesApis: [
    out-core-service-api,
    life-core-service-api
  ]
  providesApis: [
    out-workflow-wrapper-service-api
  ]
  limits: 'default kong'