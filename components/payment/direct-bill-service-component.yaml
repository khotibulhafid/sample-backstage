---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: direct-bill-service
  namespace: payment
  description: Direct Bill Service is a backend service that manages the billing inquiry process directly with billers or channels.
  tags:
    - component
    - backend
    - service
    - quarkus
    - payment
  links:
    - title: Source Repository
      url: https://code.ifg-life.id/projects/IFPY/repos/direct-bill-service/browse
    - title: Monitoring / Logs (Datadog)
      url: https://app.datadoghq.com/apm/entity/service:payment-direct-bill-service
    - title: Deployment (ArgoCD)
      url: https://deploy.ifg-life.id/applications/payment-release-direct-bill-service
    - title: Docker Image
      url: docker-paymenthub.artifact.ifg-life.id/paymenthub/service/direct-bill-service-release:1
    - title: Deployment YAML (Env & Config)
      url: https://code.ifg-life.id/projects/IFDE/repos/ifgl-8spdr-prd-prod-payment-payment-release/browse?at=refs%2Fheads%2Fdirect-bill-service
    - title: Base URL
      url: http://direct-bill-service:8080
    - title: Liveness Endpoints
      url: http://direct-bill-service:8080/q/health/live
    - title: Readiness Endpoints
      url: http://direct-bill-service:8080/q/health/ready
    - title: Swagger / Open API
      url: https://code.ifg-life.id/projects/IFSC/repos/ifpy---payment/browse/direct-bill-service
spec:
  type: REST
  owner: group:default/ifgpay
  system: system:payment/ifgpay
  domain: domain:payment/ifgpay
  lifecycle: production
  environments: prod
  language: java
  framework:
    - name: Quarkus
      version: 3.29.0
  auth:
    method: API Key
    notes: >
      Service uses Kong API Key for authorization
  secretType: Kubernetes Secret
  security:
    rotationPolicy: manual
  dependsOn: [
    resource:database/pg-payment,
    resource:payment/kafka
  ]
  runtime:
    cluster: 8spdr
    namespace: payment
  consumesApis: [
      core-services-api,
      gateway-biller-api
  ]
  providesApis: [
    direct-bill-service-api
  ]
  limits: 'default kong'