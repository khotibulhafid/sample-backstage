---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: utility-scheduler
  namespace: payment
  description: Scheduler utility to trigger scheduled processes
  tags:
  - component
  - backend
  - service
  - payment
  links:
    - title: Source Repository
      url: https://code.ifg-life.id/projects/IFPY/repos/utility-scheduler/browse
    - title: Monitoring / Logs (Datadog)
      url: https://app.datadoghq.com/apm/entity/service:payment-utility-scheduler
    - title: Deployment (ArgoCD)
      url: https://deploy.ifg-life.id/applications/payment-release-utility-scheduler
    - title: Docker Image
      url: docker://docker-paymenthub.artifact.ifg-life.id/paymenthub/service/utility-scheduler-release:34
    - title: Deployment YAML (Env & Config)
      url: https://code.ifg-life.id/projects/IFDE/repos/ifgl-8spdr-prd-prod-payment-payment-release/browse?at=refs%2Fheads%2Futility-scheduler
    - title: Base URL
      url: http://utility-scheduler:8080
    - title: Liveness Endpoints
      url: http://utility-scheduler:8080/q/health/live
    - title: Readiness Endpoints
      url: http://utility-scheduler:8080/q/health/ready
    - title: Swagger / Open API
      url: https://code.ifg-life.id/projects/IFSC/repos/ifpy---payment/browse/utility-scheduler
spec:
  type: REST
  owner: group:default/ifgpay
  system: system:payment/ifgpay
  domain: domain:payment/ifgpay
  lifecycle: production
  environments: prod
  language: java
  framework:
    - name: Quarkus
      version: 3.25.2
  auth:
    method: API Key
    notes: >
      Service uses Kong API Key for authorization
  secretType: Kubernetes Secret
  security:
    rotationPolicy: manual
  dependsOn: [
    resource:database/pg-payment,
    resource:payment/kafka
  ]
  runtime:
    cluster: 8spdr
    namespace: payment
  consumesApis: [
    gateway-biller-api,
    gateway-cts-api,
    recurring-service-api,
    core-service-api
  ]
  providesApis: [
    utility-scheduler-api
  ]
  limits: 'default kong'