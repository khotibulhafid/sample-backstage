---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: gateway-midtrans
  namespace: payment
  description: Gateway Midtrans is a backend service that acts as a payment gateway for transaction integration with Midtrans.
  tags:
    - component
    - backend
    - service
    - quarkus
    - payment
  links:
    - title: Source Repository
      url: https://code.ifg-life.id/projects/IFPY/repos/gateway-midtrans/browse
    - title: Monitoring / Logs (Datadog)
      url: https://app.datadoghq.com/apm/entity/service:payment-gateway-midtrans
    - title: Deployment (ArgoCD)
      url: https://deploy.ifg-life.id/applications/payment-release-gateway-midtrans
    - title: Docker Image
      url: docker-paymenthub.artifact.ifg-life.id/paymenthub/service/gateway-midtrans-release:12
    - title: Deployment YAML (Env & Config)
      url: https://code.ifg-life.id/projects/IFDE/repos/ifgl-8spdr-prd-prod-payment-payment-release/browse?at=refs%2Fheads%2Fgateway-midtrans
    - title: Base URL
      url: http://gateway-midtrans:8080
    - title: Liveness Endpoints
      url: http://gateway-midtrans:8080/q/health/live
    - title: Readiness Endpoints
      url: http://gateway-midtrans:8080/q/health/ready
    - title: Swagger / Open API
      url: https://code.ifg-life.id/projects/IFSC/repos/ifpy---payment/browse/gateway-midtrans
spec:
  type: REST
  owner: group:default/ifgpay
  system: system:payment/ifgpay
  domain: domain:payment/ifgpay
  lifecycle: production
  environments: prod
  language: java
  framework:
    - name: Quarkus
      version: 3.23.3
  auth:
    method: API Key
    notes: >
      Service uses Kong API Key for authorization
  secretType: Kubernetes Secret
  security:
    rotationPolicy: manual
  dependsOn: [
    resource:payment/kafka
  ]
  runtime:
    cluster: 8spdr
    namespace: payment
  consumesApis: [
    gateway-cts-api
  ]
  providesApis: [
    gateway-midtrans-api
  ]
  limits: 'default kong'
