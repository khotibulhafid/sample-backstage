---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: recurring-service
  namespace: payment
  description: Service to process recurring payment request to gateways
  tags:
  - component
  - backend
  - service
  - payment
  - quarkus
  - kafka
  - recurring
  - payment
  - autodebet
links:
  - title: Source Repository
    url: https://code.ifg-life.id/projects/IFPY/repos/recurring-service/browse
  - title: Monitoring / Logs (Datadog)
    url: https://app.datadoghq.com/apm/entity/service:payment-recurring-service
  - title: Deployment (ArgoCD)
    url: https://deploy.ifg-life.id/applications/payment-release-recurring-service
  - title: Docker Image
    url: docker://docker-paymenthub.artifact.ifg-life.id/paymenthub/service/recurring-service-release:38
  - title: Deployment YAML (Env & Config)
    url: https://code.ifg-life.id/projects/IFDE/repos/ifgl-8spdr-prd-prod-payment-payment-release/browse?at=refs%2Fheads%2Frecurring-service
  - title: Base URL
    url: http://recurring-service:8080
  - title: Liveness Endpoints
    url: http://recurring-service:8080/q/health/live
  - title: Readiness Endpoints
    url: http://recurring-service:8080/q/health/ready
  - title: Swagger / Open API
    url: https://code.ifg-life.id/projects/IFSC/repos/ifpy---payment/browse/recurring-service
spec:
  type: REST
  owner: group:default/ifgpay
  system: system:payment/ifgpay
  domain: domain:payment/ifgpay
  lifecycle: production
  environments: prod
  language: java
  framework:
    - name: Quarkus
      version: 3.29.0
  auth:
    method: API Key
    notes: >
      Service uses Kong API Key for authorization
  secretType: Kubernetes Secret
  security:
    rotationPolicy: manual
  dependsOn: [
    resource:database/pg-payment,
    resource:payment/kafka
  ]
  runtime:
    cluster: 8spdr
    namespace: payment
  consumesApis: [
    gateway-cts-api,
    gateway-bcheck-api,
    gateway-bri-api,
    gateway-btn-api,
    gateway-doku-api,
    gateway-mandiri-api,
    gateway-midtrans-api,
    gateway-pospay-api,
    gateway-xendit-api,
    gateway-yokke-api
  ]
  providesApis: [ recurring-service-api ]
  limits: 'default kong'