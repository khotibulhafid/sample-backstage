---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: recon-service
  namespace: payment
  description: Service for payment recon based on provider
  tags:
  - component
  - backend
  - service
  - payment
  - quarkus
  - reconciliation
  - ifgpay-hub
  - kafka
  links:
    - title: Source Repository
      url: https://code.ifg-life.id/projects/IFPY/repos/recon-service/browse
    - title: Monitoring / Logs (Datadog)
      url: https://app.datadoghq.com/apm/entity/service:payment-recon-service
    - title: Deployment (ArgoCD)
      url: https://deploy.ifg-life.id/applications/payment-release-recon-service
    - title: Docker Image
      url: docker://docker-paymenthub.artifact.ifg-life.id/paymenthub/service/recon-service-release:33
    - title: Deployment YAML (Env & Config)
      url: https://code.ifg-life.id/projects/IFDE/repos/ifgl-8spdr-prd-prod-payment-payment-release/browse?at=recon-service
    - title: Base URL
      url: http://recon-service:8080
    - title: Liveness Endpoints
      url: http://recon-service:8080/q/health/live
    - title: Readiness Endpoints
      url: http://recon-service:8080/q/health/ready
    - title: Swagger / Open API
      url: https://code.ifg-life.id/projects/IFSC/repos/ifpy---payment/browse/recon-service
spec:
  type: REST
  owner: group:default/ifgpay
  system: system:payment/ifgpay
  domain: domain:payment/ifgpay
  lifecycle: production
  environments: prod
  language: java
  framework:
    - name: Quarkus
      version: 3.29.0
  auth:
    method: API Key
    notes: >
      Service uses Kong API Key for authorization
  secretType: Kubernetes Secret
  security:
    rotationPolicy: manual
  dependsOn: [
    resource:database/pg-payment,
    resource:payment/kafka
  ]
  runtime:
    cluster: 8spdr
    namespace: payment
  consumesApis: [ core-services-api ]
  providesApis: [ recon-service-api ]