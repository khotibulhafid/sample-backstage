---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: gateway-mandiri
  namespace: payment
  description: Gateway Mandiri is a backend service that acts as a payment gateway for transaction integration with Bank Mandiri.
  tags:
    - component
    - backend
    - service
    - payment
    - quarkus
  links:
    - title: Source Repository
      url: https://code.ifg-life.id/projects/IFPY/repos/gateway-mandiri/browse
    - title: Monitoring / Logs (Datadog)
      url: https://app.datadoghq.com/apm/entity/service:payment-gateway-mandiri
    - title: Deployment (ArgoCD)
      url: https://deploy.ifg-life.id/applications/payment-release-gateway-mandiri
    - title: Docker Image
      url:
    - title: Deployment YAML (Env & Config)
      url: https://code.ifg-life.id/projects/IFDE/repos/ifgl-8spdr-prd-prod-payment-payment-release/browse?at=refs%2Fheads%2Fgateway-mandiri
    - title: Base URL
      url: http://gateway-mandiri:8080
    - title: Liveness Endpoints
      url: http://gateway-mandiri/q/health/live
    - title: Readiness Endpoints
      url: http://gateway-mandiri/q/health/ready
    - title: Swagger / Open API
      url: https://code.ifg-life.id/projects/IFSC/repos/ifpy---payment/browse/gateway-mandiri
  spec:
    type: REST
    owner: group:default/ifgpay
    system: system:payment/ifgpay
    domain: domain:payment/ifgpay
    lifecycle: production
    environments: prod
    language: java
    framework:
      - name: Quarkus
        version: 3.31.2
    auth:
      method: API Key
      notes: >
        Service uses Kong API Key for authorization
    secretType: Kubernetes Secret
    security:
      rotationPolicy: manual
    dependsOn: [
      resource:payment/kafka
    ]
    runtime:
      cluster: 8spdr
      namespace: payment
    consumesApis: [
      gateway-cts-api,
      core-services-api,
      inquiry-core-service-api
    ]
    providesApis: [
      gateway-mandiri-api
    ]
    limits: 'default kong'