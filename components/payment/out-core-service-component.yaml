---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: out-core-service
  namespace: payment
  description: Out Core Service is a backend core service that manages disbursement and account inquiry processes.
  tags:
    - component
    - backend
    - service
    - quarkus
    - payment
  links:
    - title: Source Repository
      url: https://code.ifg-life.id/projects/IFPY/repos/out-core-service/browse
    - title: Monitoring / Logs (Datadog)
      url: https://app.datadoghq.com/apm/entity/service:payment-out-core-service
    - title: Deployment (ArgoCD)
      url: https://deploy.ifg-life.id/applications/payment-release-out-core-service
    - title: Docker Image
      url: docker-paymenthub.artifact.ifg-life.id/paymenthub/service/out-core-service-release:48
    - title: Deployment YAML (Env & Config)
      url: https://code.ifg-life.id/projects/IFDE/repos/ifgl-8spdr-prd-prod-payment-payment-release/browse?at=refs%2Fheads%2Fout-core-service
    - title: Base URL
      url: http://out-core-service:8080
    - title: Liveness Endpoints
      url: http://out-core-service:8080/q/health/live
    - title: Readiness Endpoints
      url: http://out-core-service:8080/q/health/ready
    - title: Swagger / Open API
      url: https://code.ifg-life.id/projects/IFSC/repos/ifpy---payment/browse/out-core-service
spec:
  type: REST
  owner: group:default/ifgpay
  system: system:payment/ifgpay
  domain: domain:payment/ifgpay
  lifecycle: production
  environments: prod
  language: java
  framework:
    - name: Quarkus
      version: 3.23.4
  auth:
    method: API Key
    notes: >
      Service uses Kong API Key for authorization
  secretType: Kubernetes Secret
  security:
    rotationPolicy: manual
  dependsOn: [
    resource:database/pg-payment,
    resource:payment/kafka
  ]
  runtime:
    cluster: 8spdr
    namespace: payment
  consumesApis: [
    out-gateway-cts-service-api,
    out-gateway-mandiri-service-api,
    out-gateway-channel-service-api,
    out-workflow-wrapper-service-api
  ]
  providesApis: [
    out-core-service-api
  ]
  limits: 'default kong'