---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: utility-kafka-listener
  namespace: payment
  description: Kafka listener utility to listen and trigger processes
  tags:
  - component
  - backend
  - service
  - payment
  - quarkus
  - kafka
  - kafka-listener
  links:
    - title: Source Repository
      url: https://code.ifg-life.id/projects/IFPY/repos/utility-kafka-listener/browse
    - title: Monitoring / Logs (Datadog)
      url: https://app.datadoghq.com/apm/entity/service:payment-utility-kafka-listener
    - title: Deployment (ArgoCD)
      url: https://deploy.ifg-life.id/applications/payment-release-utility-kafka-listener
    - title: Docker Image
      url: docker://docker-paymenthub.artifact.ifg-life.id/paymenthub/service/utility-kafka-listener-release:28
    - title: Deployment YAML (Env & Config)
      url: https://code.ifg-life.id/projects/IFDE/repos/ifgl-8spdr-prd-prod-payment-payment-release/browse?at=utility-kafka-listener
    - title: Base URL
      url: http://utility-kafka-listener:8080
    - title: Liveness Endpoints
      url: http://utility-kafka-listener:8080/q/health/live
    - title: Readiness Endpoints
      url: http://utility-kafka-listener:8080/q/health/ready
    - title: Swagger / Open API
      url: https://code.ifg-life.id/projects/IFSC/repos/ifpy---payment/browse/utility-kafka-listener
spec:
  type: REST
  owner: group:default/ifgpay
  system: system:payment/ifgpay
  domain: domain:payment/ifgpay
  lifecycle: production
  environments: prod
  language: java
  framework:
    - name: Quarkus
      version: 3.23.4
  auth:
    method: API Key
    notes: >
      Service uses Kong API Key for authorization
  secretType: Kubernetes Secret
  security:
    rotationPolicy: manual
  dependsOn: [
    resource:payment/kafka,
    resource:database/pg-payment
  ]
  runtime:
    cluster: 8spdr
    namespace: payment
  consumesApis: [ 
    core-services-api,
    inquiry-core-service-api
  ]
  providesApis: [
    utility-kafka-listener-api
  ]
  limits: 'default kong'