---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: inquiry-core-service
  namespace: payment
  description: Service for payment in inquiries routing
  tags:
  - component
  - backend
  - service
  - payment
  - quarkus
  - inquiry
  - routing
  links:
    - title: Source Repository
      url: https://code.ifg-life.id/projects/IFPY/repos/inquiry-core-service/browse
    - title: Monitoring / Logs (Datadog)
      url: https://app.datadoghq.com/apm/entity/service:payment-inquiry-core-service
    - title: Deployment (ArgoCD)
      url: https://deploy.ifg-life.id/applications/payment-release-inquiry-core-service
    - title: Docker Image
      url: docker://docker-paymenthub.artifact.ifg-life.id/paymenthub/service/inquiry-core-service-release:5
    - title: Deployment YAML (Env & Config)
      url: https://code.ifg-life.id/projects/IFDE/repos/ifgl-8spdr-prd-prod-payment-payment-release/browse?at=inquiry-core-service
    - title: Base URL
      url: http://inquiry-core-service:8080
    - title: Liveness Endpoints
      url: http://inquiry-core-service:8080/q/health/live
    - title: Readiness Endpoints
      url: http://inquiry-core-service:8080/q/health/ready
    - title: Swagger / Open API
      url: https://code.ifg-life.id/projects/IFSC/repos/ifpy---payment/browse/inquiry-core-service
spec:
  type: REST
  owner: group:default/ifgpay
  system: system:payment/ifgpay
  domain: domain:payment/ifgpay
  lifecycle: production
  environments: prod
  language: java
  framework:
    - name: Quarkus
      version: 3.23.4
  auth:
    method: API Key
    notes: >
      Service uses Kong API Key for authorization
  secretType: Kubernetes Secret
  security:
    rotationPolicy: manual
  dependsOn: [
    resource:payment/kong
  ]
  runtime:
    cluster: 8spdr
    namespace: payment
  consumesApis: []
  providesApis: [ inquiry-core-service-api ]