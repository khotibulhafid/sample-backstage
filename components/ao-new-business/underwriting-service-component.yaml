---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: underwriting-service
  namespace: ao-new-business
  description: The new business service api in new-business-underwriting-service
  tags:
    - service
    - quarkus
    - backend
    - underwriting
  links:
    - title: Source Repository
      url: https://code.ifg-life.id/projects/IFNB/repos/underwriting-service/browse
    - title: Monitoring / Logs (Datadog)
      url: https://app.datadoghq.com/apm/entity/service:underwriting-service
    - title: Deployment (ArgoCD)
      url: https://deploy.ifg-life.id/applications/ao-new-business-release-underwriting-service
    - title: Docker Image
      url: docker://docker-automation-operation.artifact.ifg-life.id/ao-new-business/underwriting-service-release:59
    - title: Deployment YAML (Env & Config)
      url: https://code.ifg-life.id/projects/IFDE/repos/ifgl-1awvh-prd-prod-automation-ao-new-business-release/browse?at=refs%2Fheads%2Funderwriting-service
    - title: Liveness Endpoints
      url: https://underwriting-service:8080/q/health/live
    - title: Readiness Endpoints
      url: https://underwriting-service:8080/q/health/ready
    - title: Documentation
      url: https://code.ifg-life.id/projects/IFNB/repos/underwriting-service/browse/README.md
    - title: Base URL
      url: https://api-core.ifg-life.id
spec:
  type: REST
  lifecycle: production
  owner: group:automation/new-business
  system: system:core/new-business-core-system
  domain: domain:core-system
  environments: prod
  language: java
  framework:
    - name: Quarkus
    - version: 3.28.1
  secretType: Kubernetes Secret
  security:
    rotationPolicy: manual
  runtime:
    cluster: cluster-automation-prd
    namespace: ao-new-business
  consumeApis: [ ]
  usesLibraries:
    - name: "Postgres"
      implemented: True
  limits: "-"
  auth:
    method: apiKey
  dependsOn: [
    resource:default/prd-automation, # EKS
    resource:infra/1awvh-prd-prod-automation-az2, # Cluster
    resource:database/pg-core,
    resource:core/kong
  ]
  providesApis: [ao-new-business/underwriting-service-api]
