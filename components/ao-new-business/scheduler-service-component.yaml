---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: scheduler-service
  namespace: ao-new-business
  description: The scheduler-service is service scheduler in core pas
  tags:
    - component
    - backend
    - service
    - scheduler
    - quarkus
  links:
    - title: Source Repository
      url: https://code.ifg-life.id/projects/IFNB/repos/scheduler-service/browse
    - title: Monitoring / Logs (Datadog)
      url: https://app.datadoghq.com/apm/entity/service:nb-scheduler-service
    - title: Deployment (ArgoCD)
      url: https://deploy.ifg-life.id/applications/ao-new-business-release-scheduler-service
    - title: Docker Image
      url: docker://docker-automation-operation.artifact.ifg-life.id/ao-new-business/scheduler-service-release:41
    - title: Deployment YAML (Env & Config)
      url: https://code.ifg-life.id/projects/IFDE/repos/ifgl-1awvh-prd-prod-automation-ao-new-business-release/browse?at=refs%2Fheads%2Fscheduler-service
    - title: Liveness Endpoints
      url: https://localhost:8080/q/health/live
    - title: Readiness Endpoints
      url: https://localhost:8080/q/health/ready
    - title: Documentation
      url: https://code.ifg-life.id/projects/IFNB/repos/scheduler-service/browse/README.md
    - title: Base URL
      url: https://api-core.ifg-life.id
    - title: Kafka Topic List
      url: https://code.ifg-life.id/projects/IFNB/repos/scheduler-service/browse/kafka_topic_documentation.md
    - title: Sample Kafka Message
      url: https://code.ifg-life.id/projects/IFNB/repos/scheduler-service/browse/kafka_topic_documentation.md
    - title: Swagger / Open API
      url: http://correspondence-wrapper:8080/q/openapi
spec:
  type: service
  lifecycle: production
  owner: group:core/pas
  system: system:core/policy-administration-system
  domain: domain:core/core-business
  consumeApis: [
    api:ao-product-engine/pas-edoc-service-api,
    api:ao-new-business/billing-service-api,
    api:ao-new-business/meta-service-api,
    api:ao-new-business/policy-service-v2-api,
    api:ao-new-business/transaction-management-service-api,
    api:ao-new-business/audit-service-api,
    api:acct-mgmt-system/interest-service-api,
    api:acct-mgmt-system/account-service-api,
    api:acct-mgmt-system/balance-service-api,
    api:payment/gateway-biller-api,
    api:ifgid/organization-service-api,
    api:ifgid/ekyc-service-api,
    api:ao-product-engine/product-config-service-api,
    api:ao-product-engine/initial-validation-service-api,
  ]
  providesApis: [
    api:ao-new-business/scheduler-service-api
  ]
  dependsOn: [
    resource:default/eks-1awvh-prd, #EKS
    resource:infra/cluster-1awvh-prd, #Cluster
    resource:ao-workflow/ifgl-1awvh-prd-automation-db, #PostgreSQL DB
    resource:core/kong, #Gateway,
    resource:infra/kafka
  ]
  environments: prod
  language: java
  framework:
    - name: Quarkus
    - version: 3.27.0
  auth:
    method: API Key
    notes: >
      Service uses Kong API Key for authorization
  secretType: Kubernetes Secret
  security:
    rotationPolicy: manual
  runtime:
    cluster: 1awvh
    namespace: ao-new-business
  limits: 'default kong'
