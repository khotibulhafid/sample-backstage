---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: meta-service
  namespace: ao-new-business
  description: The meta-service is service for configuration data master variable in core pas
  tags:
    - component
    - backend
    - service
    - meta
    - quarkus
    - uat
  links:
    - title: Source Repository
      url: https://code.ifg-life.id/projects/IFNB/repos/meta-service/browse
    - title: Monitoring / Logs (Datadog)
      url: https://app.datadoghq.com/apm/entity/service:nb-meta-service
    - title: Deployment (ArgoCD)
      url: https://deploy.ifg-life.id/applications/ao-new-business-uat-meta-service
    - title: Docker Image
      url: docker://docker-automation-operation.artifact.ifg-life.id/ao-new-business/meta-service-uat:latest
    - title: Deployment YAML (Env & Config)
      url: https://code.ifg-life.id/projects/IFDE/repos/ifgl-pflcb-nprd-uat-automation-ao-new-business-uat/browse/deployment.yaml?at=refs%2Fheads%2Fmeta-service
    - title: Liveness Endpoints
      url: https://localhost:8080/q/health/live
    - title: Readiness Endpoints
      url: https://localhost:8080/q/health/ready
    - title: Documentation
      url: https://code.ifg-life.id/projects/IFNB/repos/meta-service/browse/README.md
spec:
  type: REST
  owner: group:core/pas
  system: system:core/policy-administration-system
  domain: domain:core/core-business
  lifecycle: experimental
  environments: uat
  language: java
  framework:
    - name: Quarkus
    - version: 3.24.3
  auth:
    method: API Key
    notes: >
      Service uses Kong API Key for authorization
  secretType: Kubernetes Secret
  security:
    rotationPolicy: manual
  runtime:
    cluster: 1awvh
    namespace: ao-new-business
  limits: 'default kong'
  dependsOn: [
    resource:default/eks-1awvh-prd, #EKS
    resource:infra/cluster-1awvh-prd, #Cluster
    resource:ao-workflow/ifgl-1awvh-prd-automation-db, #PostgreSQL DB
    resource:core/kong #Gateway
  ]
  consumeApis: [ ]
  providesApis: [
#    api:core/meta-service-api
  ]
  usesLibraries:
    - name: "rest-client"
      implemented: False