---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: cron-core-pas-service
  namespace: ao-new-business
  description: Service to run core pas cron jobs
  tags:
    - cron
    - component
    - scheduler
  links:
    - title: Source Repository
      url: https://code.ifg-life.id/projects/IFNB/repos/cron-core-pas-service/browse?at=release
#    - title: Documentation
#      url: <url_documentation>
    - title: Deployment (ArgoCD)
      url: https://deploy.ifg-life.id/applications/ao-new-business-release-cron-core-pas-service
    - title: Docker Image
      url: docker://docker-automation-operation.artifact.ifg-life.id/ao-new-business/cron-core-pas-service-release:latest
    - title: Deployment YAML (Env & Config)
      url: https://code.ifg-life.id/projects/IFCJ/repos/ifgl-prd-1awvh-core-pas-service/browse
spec:
  type: Scheduler
  owner: group:core/pas
  system: system:core/policy-administration-system
  domain: domain:core/core-business
  lifecycle: production
  environments: production
  secretType: Kubernetes Secret
  runtime:
    cluster: 1awvh-prd-prod-automation-az2
    namespace: ao-new-business
  limits: '-'
  consumesApis: [
    api:ao-new-business/scheduler-service-api,
    api:ao-new-business/new-business-service-v2-api,
    api:ao-new-business/billing-service-api,
    api:ao-new-business/audit-service-api
  ]