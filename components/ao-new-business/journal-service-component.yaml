---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: journal-service
  namespace: ao-new-business
  description: The journal-service is service that manages accounting journaling processes, including transaction processing (claims, settlement, general journals) and journal/slip template management
  tags:
    - backend
    - service
    - policy
    - journal
    - quarkus
  links:
    - title: Source Repository
      url: https://code.ifg-life.id/projects/IFNB/repos/journal-service/browse
    - title: Monitoring / Logs (Datadog)
      url: https://app.datadoghq.com/apm/entity/service:nb-journal-service
    - title: Deployment (ArgoCD)
      url: https://deploy.ifg-life.id/applications/ao-new-business-release-journal-service
    - title: Docker Image
      url: docker://docker-automation-operation.artifact.ifg-life.id/ao-new-business/journal-service-release:6
    - title: Deployment YAML (Env & Config)
      url: https://code.ifg-life.id/projects/IFDE/repos/ifgl-1awvh-prd-prod-automation-ao-new-business-release/browse/deployment.yaml?at=refs%2Fheads%2Fjournal-service
    - title: Liveness Endpoints
      url: https://localhost:8080/q/health/live
    - title: Readiness Endpoints
      url: https://localhost:8080/q/health/ready
    - title: Documentation
      url: https://code.ifg-life.id/projects/IFNB/repos/journal-service/browse/README.md
    - title: Base URL
      url: https://api-core.ifg-life.id
spec:
  type: REST
  owner: group:core/pas
  system: system:core/policy-administration-system
  domain: domain:core/core-business
  lifecycle: deprecated
  environments: prod
  language: java
  framework:
    - name: Quarkus
    - version: 3.17.0
  auth:
    method: API Key
    notes: >
      Service uses Kong API Key for authorization
  secretType: Kubernetes Secret
  security:
    rotationPolicy: manual
  runtime:
    cluster: 1awvh
    namespace: ao-new-business
  limits: 'default kong'
  dependsOn: [
    resource:default/eks-1awvh-prd, #EKS
    resource:infra/cluster-1awvh-prd, #Cluster
    resource:database/ifgretail, #Oracle DB
    resource:database/ifgfinance, #Oracle DB
    resource:core/kong #Gateway
  ]
  consumeApis: [
    api:ao-new-business/policy-service-v2-api
  ]
  providesApis: [
    api:ao-new-business/journal-service-api
  ]
  usesLibraries:
    - name: "rest-client"
      implemented: False