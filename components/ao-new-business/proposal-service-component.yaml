---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: proposal-service
  namespace: ao-new-business
  description: The proposal-service api in new-business
  tags:
    - backend
    - service
    - proposal
    - quarkus
  links:
    - title: Source Repository
      url: https://code.ifg-life.id/projects/IFNB/repos/proposal-service/browse
    - title: Monitoring / Logs (Datadog)
      url: https://app.datadoghq.com/apm/entity/service:nb-proposal-service
    - title: Deployment (ArgoCD)
      url: https://deploy.ifg-life.id/applications/ao-new-business-release-proposal-service
    - title: Docker Image
      url: docker://docker-automation-operation.artifact.ifg-life.id/ao-new-business/proposal-service-release:20
    - title: Deployment YAML (Env & Config)
      url: https://code.ifg-life.id/projects/IFDE/repos/ifgl-1awvh-prd-prod-automation-ao-new-business-release/browse?at=refs%2Fheads%2Fproposal-service
    - title: Liveness Endpoints
      url: https://localhost:8080/q/health/live
    - title: Readiness Endpoints
      url: https://localhost:8080/q/health/ready
    - title: Documentation
      url: https://code.ifg-life.id/projects/IFNB/repos/proposal-service/browse/README.md
    - title: Base URL
      url: https://api-core.ifg-life.id
    - title: Kafka Topic List
      url: https://code.ifg-life.id/projects/IFNB/repos/proposal-service/browse/kafka_topic_documentation.md
    - title: Sample Kafka Message
      url: https://code.ifg-life.id/projects/IFNB/repos/proposal-service/browse/kafka_topic_documentation.md
spec:
  type: service
  lifecycle: deprecated
  owner: group:core/pas
  system: system:core/policy-administration-system
  domain: domain:core/core-business
  consumeApis: [
    api:ao-new-business/underwriting-service-api,
    api:ao-new-business/billing-service-api,
    api:ao-new-business/policy-service-api,
    api:ao-new-business/journal-service-api,
    api:ao-product-engine/product-config-service-api,
    api:ao-product-engine/storage-service-api,
    api:payment/core-services-api,
    api:customer/user-wrapper-api
  ]
  providesApis: [
    api:ao-new-business/proposal-service-api
  ]
  dependsOn: [
    resource:default/eks-1awvh-prd, #EKS
    resource:infra/cluster-1awvh-prd, #Cluster
    resource:ao-workflow/ifgl-1awvh-prd-automation-db, #PostgreSQL DB
    resource:core/kong, #Gateway,
    resource:infra/kafka
  ]
  environments: prod
  language: java
  framework:
    - name: Quarkus
    - version: 3.6.4
  auth:
    method: API Key
    notes: >
      Service uses Kong API Key for authorization
  secretType: Kubernetes Secret
  security:
    rotationPolicy: manual
  runtime:
    cluster: 1awvh
    namespace: ao-new-business
  limits: 'default kong'
