---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: new-business-service-v2
  namespace: ao-new-business
  description: The new-business-service-v2 api in new-business
  tags:
    - component
    - backend
    - service
    - policy
    - new-business
    - quarkus
  links:
    - title: Source Repository
      url: https://code.ifg-life.id/projects/IFNB/repos/nb-service/browse
    - title: Monitoring / Logs (Datadog)
      url: https://app.datadoghq.com/apm/entity/service:nb-new-business-service-v2
    - title: Deployment (ArgoCD)
      url: https://deploy.ifg-life.id/applications/ao-new-business-release-new-business-service-v2
    - title: Docker Image
      url: docker://docker-automation-operation.artifact.ifg-life.id/ao-new-business/new-business-service-v2-release:2
    - title: Deployment YAML (Env & Config)
      url: https://code.ifg-life.id/projects/IFDE/repos/ifgl-1awvh-prd-prod-automation-ao-new-business-release/browse?at=refs%2Fheads%2Fnew-business-service-v2
    - title: Liveness Endpoints
      url: https://localhost:8080/q/health/live
    - title: Readiness Endpoints
      url: https://localhost:8080/q/health/ready
    - title: Documentation
      url: https://code.ifg-life.id/projects/IFNB/repos/nb-service/browse/README.md
    - title: Base URL
      url: https://api-core.ifg-life.id
    - title: Kafka Topic List
      url: https://code.ifg-life.id/projects/IFNB/repos/nb-service/browse/kafka_topic_documentation.md
    - title: Sample Kafka Message
      url: https://code.ifg-life.id/projects/IFNB/repos/nb-service/browse/kafka_topic_documentation.md
spec:
  type: service
  lifecycle: production
  owner: group:core/pas
  system: system:core/policy-administration-system
  domain: domain:core/core-business
  consumeApis: [
    api:ao-new-business/audit-service-api,
    api:ao-new-business/proposal-service-v2-api,
    api:ao-new-business/policy-service-v2-api,
    api:ao-new-business/journal-service-api,
    api:ao-new-business/billing-service-api,
    api:ao-new-business/transaction-management-service-api,
    api:ao-new-business/underwriting-service-api,
    api:ao-product-engine/generator-service-api,
    api:ao-product-engine/storage-service-api,
    api:ao-product-engine/notification-service-api,
    api:ao-product-engine/pas-edoc-service-api,
    api:ao-product-engine/product-config-service-api,
    api:ao-product-engine/product-config-service-v2-api,
    api:payment/gateway-biller-api,
    api:workflow-fraud/ao-workflow-aml-wrapper-api,
    api:customer/user-wrapper-api,
    api:customer/product-service-api,
    api:customer/referral-service-api,
    api:ifgid/user-service-api,
    api:ifgid/ekyc-service-api,
    api:ifgid/organization-service-api,
    api:lifeforce-individu/new-business-service-api,
    api:partnership/partnership-service-api,
    api:acct-mgmt-system/balance-service-api
  ]
  providesApis: [
    api:ao-new-business/new-business-service-v2-api
  ]
  dependsOn: [
    resource:default/eks-1awvh-prd, #EKS
    resource:infra/cluster-1awvh-prd, #Cluster
    resource:ao-workflow/ifgl-1awvh-prd-automation-db, #PostgreSQL DB
    resource:core/kong, #Gateway,
    resource:infra/kafka
  ]
  environments: prod
  language: java
  framework:
    - name: Quarkus
    - version: 3.29.3
  auth:
    method: API Key
    notes: >
      Service uses Kong API Key for authorization
  secretType: Kubernetes Secret
  security:
    rotationPolicy: manual
  runtime:
    cluster: 1awvh
    namespace: ao-new-business
  limits: 'default kong'
