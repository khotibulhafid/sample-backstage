---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: provider-mapping-network-service
  namespace: lifenet-network
  description: service for manage network for Lifenet System
  tags:
    - backend
    - service
    - lifenet-network
    - lifenet
  links:
    - title: Source Repository
      url: https://code.ifg-life.id/projects/ILEN/repos/provider-mapping-network-service/browse
#    - title: Monitoring / Logs (Datadog)
#      url: #Need to get value
    - title: Deployment (ArgoCD)
      url: https://deploy.ifg-life.id/applications/lifenet-network-release-provider-mapping-network-service
    - title: Docker Image
      url: docker://docker-hospital.artifact.ifg-life.id/lifenet/provider-mapping-network-service
    - title: Deployment YAML (Env & Config)
      url: https://code.ifg-life.id/projects/IFDE/repos/ifgl-tu9b2-prd-prod-lifenet-lifenet-network-release/browse?at=refs%2Fheads%2Fprovider-mapping-network-service
    - title: Base URL
      url: https://net-admin.life.id
    - title: Liveness Endpoints
      url: http://provider-mapping-network-service.lifenet-network.svc:8080/api/q/health/live
    - title: Documentation
      url: https://code.ifg-life.id/projects/ILEN/repos/provider-mapping-network-service/browse/README.md
spec:
  type: REST
  lifecycle: production
  owner: group:channel/lifenet-network
  system: system:channel/lifenet-network-system
  domain: domain:lifenet/lifenet
  language: java
  framework:
    - name: Quarkus
    - version: 3.19.4
  auth:
    method: API Key
    notes: >
      Service uses Kong API Key for authorization
  secretType: Kubernetes Secret
  security:
    rotationPolicy: manual
  runtime:
    cluster: lifenet-prd
    namespace: lifenet-issuer
#  subcomponentOf: lifenet-admin-backend
  dependsOn: [resource:lifenet-prd]
  providesApis: [provider-mapping-network-service-api]
  limits: 'default kong'