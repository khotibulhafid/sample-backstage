---     
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: user-service
  namespace: corporate
  description: The corporate user-service api in corporate-user-service
  title: Corporate user Service
  tags:
    - backend
    - service
    - user-management
    - role-management
    - quarkus
  links:
    - title: Source Repository
      url: https://code.ifg-life.id/projects/IFCO/repos/user-service/browse
    - title: Monitoring / Logs (Datadog)
      url: https://app.datadoghq.com/apm/entity/service%3Acorporate-user-service
    - title: Deployment (ArgoCD)
      url: https://deploy.ifg-life.id/applications/argocd/corporate-release-user-service?view=tree&resource=
    - title: Docker Image
      url: docker://docker-corporate.artifact.ifg-life.id/corporate/user-service-release:66
    - title: Deployment YAML (Env & Config)
      url: https://code.ifg-life.id/projects/IFDE/repos/ifgl-bvl19-prd-prod-customer-corporate-release/browse?at=refs%2Fheads%2Fuser-service
    - title: Base URL
      url: https://api-corporate-release.ifg-life.id
    - title: Liveness Endpoints
      url: https://user-service:8080/api/q/health/live
    - title: Readiness Endpoints
      url: https://user-service:8080/api/q/health/ready
    - title: Documentation
      url: https://code.ifg-life.id/projects/IFCO/repos/user-service/browse/README.md
spec:
  type: REST
  owner: default/lifespace
  system: lifespace
  domain: domain:lifespace-domain
  lifecycle: production
  environments: prod
  language: java
  framework:
    - name: Quarkus
    - version: 3.24.3
  auth:
    method: OAuth2.0
    notes: >
      Service uses Kong OAuth2.0 for authorization
  secretType: Kubernetes Secret
  security:
    rotationPolicy: manual
  runtime:
    cluster: customer
    namespace: corporate
  limits: 'default kong'
  dependsOn: [resource:default/ifgl-bvl19-prd-prod-customer-customerapps,resource:default/kafka]
  providesApis: [user-service-api]
  consumesApis: [user-service-api,member-service-api,corporate-wrapper-api,policy-service-api]
  usesLibraries:
    - name: "rest-client"
      implemented: False