    - title: Deployment (ArgoCD)
      url: https://deploy.ifg-life.id/applications/lifenet-issuer-uat-issuer-ifgl-case-monitoring-service
    - title: Docker Image
      url: docker://docker-hospital.artifact.ifg-life.id/lifenet/issuer-ifgl-case-monitoring-service-uat
    - title: Deployment YAML (Env & Config)
