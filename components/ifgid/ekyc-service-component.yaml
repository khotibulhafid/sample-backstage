---     
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ekyc-service
  namespace: ifgid
  description: Service for EKYC Related for All Channel / Tribe
  tags:
    - component
    - backend
    - service
    - ifgid
spec:
  type: service
  lifecycle: production
  owner: default/ifgid
  system: ifgid
  dependsOn: [ resource:default/ifgid-prd, resource:default/prd-ifgid, resource:default/ifgid-s3, resource:default/ifgid-prd-13-2, resource:default/third-party ]
  consumesApis: [ user-service-api, meta-service-api, storage-service-api ]
  providesApis: [ ekyc-service-api ]
