  lifecycle: production
  owner: default/ifgid
  system: ifgid
  dependsOn: [ resource:default/ifgid-prd, resource:default/prd-ifgid, resource:default/ifgid-prd-13-2 ]
  consumesApis: [ ekyc-service-api, meta-service-api, storage-service-api ]
  providesApis: [ organization-service-api ]
