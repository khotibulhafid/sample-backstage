apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: data-customer-service
  namespace: data
  description: Data Customer Service
  title: Data Customer Service Service
  tags:
    - component
    - backend
    - service
    - data
    - quarkus
  links:
    - title: Source Repository
      url: https://code.ifg-life.id/projects/IFDA/repos/data-customer-service
    - title: Monitoring / Logs (Datadog)
      url: https://app.datadoghq.com/apm/entity/service:data-mongo-service
    - title: Deployment (ArgoCD)
      url: https://deploy.ifg-life.id/applications/data-release-mongo-service
    - title: Docker Image
      url: docker://docker-data.artifact.ifg-life.id/mongo/data-customer-service-release:55
    - title: Deployment YAML (Env & Config)
      url: https://code.ifg-life.id/projects/IFDE/repos/ifgl-m8ccz-prd-prod-graphdb-data-release/browse/mongo.yaml?at=mongo
    - title: Base URL
      url: https://data.ifg-life.id/api/v1/
    - title: GraphQL URL
      url: https://data.ifg-life.id/api/graphql
    - title: Liveness Endpoints
      url: https://mongo-service:8080/api/q/health/live
    - title: Readiness Endpoints
      url: https://mongo-service:8080/api/q/health/ready
    - title: Documentation
      url: https://code.ifg-life.id/projects/IFDA/repos/data-customer-service/browse/README.md
#    - title: Kafka Topic List
#      url: https://code.ifg-life.id/projects/IFDA/repos/data-base-service/browse/kafka-topics.md
#    - title: Sample Kafka Message
#      url: https://code.ifg-life.id/projects/IFDA/repos/data-base-service/browse/kafka-topics.md
spec:
  type: REST
  owner: group:data/data-access
  system: system:data/data-access-system
  domain: domain:data/data-platform
  lifecycle: production
  environments: prod
  language: java
  framework:
    - name: Quarkus
    - version: 3.29.3
  auth:
    method: API Key
    notes: >
      Service uses Kong API Key for authorization
  secretType: Kubernetes Secret
  security:
    rotationPolicy: manual
  runtime:
    cluster: cluster-data-prd
    namespace: data
  limits: 'default kong'
  dependsOn: [
    resource:default/eks-data-prd, #EKS 
    resource:infra/cluster-data-prd, #Cluster 
    resource:database/mongodb, #Database
    resource:data/kong #Gateway
  ]
  consumeApis: []
  providesApis: [
    api:data/customer-service-api
  ]
  usesLibraries:
    - name: "rest-client"
      implemented: False