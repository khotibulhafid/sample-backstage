apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: data-scheduler-service
  namespace: data
  description: Data Scheduler Service
  title: Data Scheduler Service
  tags:
    - component
    - backend
    - service
    - data
    - fastapi
  links:
    - title: Source Repository
      url: https://code.ifg-life.id/projects/IFDA/repos/data-scheduler-service/browse
    - title: Monitoring / Logs (Datadog)
      url: https://app.datadoghq.com/apm/entity/service:data-scheduler-service
    - title: Deployment (ArgoCD)
      url: https://deploy.ifg-life.id/applications/data-release-data-scheduler-service?resource=
    - title: Docker Image
      url: docker://docker-data.artifact.ifg-life.id/data/data-scheduler-service-release:2
    - title: Deployment YAML (Env & Config)
      url: https://code.ifg-life.id/projects/IFDE/repos/ifgl-m8ccz-prd-prod-graphdb-data-release/browse/deployment.yaml?at=data-scheduler-service
    - title: Base URL
      url: https://data.ifg-life.id/api/v1/
    - title: Liveness Endpoints
      url: https://data-scheduler-service:8080/api/q/health/live
    - title: Readiness Endpoints
      url: https://data-scheduler-service:8080/api/q/health/ready
    - title: Documentation
      url: https://code.ifg-life.id/projects/IFDA/repos/data-scheduler-service/browse/README.md
#    - title: Kafka Topic List
#      url: https://code.ifg-life.id/projects/IFDA/repos/data-base-service/browse/kafka-topics.md
#    - title: Sample Kafka Message
#      url: https://code.ifg-life.id/projects/IFDA/repos/data-base-service/browse/kafka-topics.md
spec:
  type: REST
  owner: group:data/data-lake
  system: system:data/data-ingestion-system
  domain: domain:data/data-platform
  lifecycle: production
  environments: prod
  language: python3.12
  framework:
    - name: FastAPI
    - version: 0.124.2
  auth:
    method: API Key
    notes: >
      Service uses Kong API Key for authorization
  secretType: Kubernetes Secret
  security:
    rotationPolicy: manual
  runtime:
    cluster: cluster-data-prd
    namespace: data
  limits: 'default kong'
  dependsOn: [
    resource:default/eks-data-prd, #EKS 
    resource:infra/cluster-data-prd, #Cluster 
    resource:database/mongodb, #Database
    resource:data/kong #Gateway
  ]
  consumeApis: []
  providesApis: [
#    api:data/data-scheduler-service-api
  ]
  usesLibraries:
    - name: "rest-client"
      implemented: False