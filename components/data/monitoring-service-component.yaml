apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: monitoring-service
  namespace: data
  description: Data Monitoring Service
  title: Data Monitoring Service
  tags:
    - component
    - backend
    - service
    - data
    - quarkus
  links:
    - title: Source Repository
      url: https://code.ifg-life.id/projects/IFDA/repos/data-monitoring-service/browse
    - title: Monitoring / Logs (Datadog)
      url: https://app.datadoghq.com/apm/entity/service:data-monitoring-service
    - title: Deployment (ArgoCD)
      url: https://deploy.ifg-life.id/applications/data-release-monitoring-service?resource=
    - title: Docker Image
      url: docker://docker-data.artifact.ifg-life.id/job/data-monitoring-service-release:21
    - title: Deployment YAML (Env & Config)
      url: https://code.ifg-life.id/projects/IFDE/repos/ifgl-m8ccz-prd-prod-graphdb-data-release/browse/deployment.yaml?at=monitoring-service
    - title: Base URL
      url: https://data.ifg-life.id/api/v1/
    - title: Liveness Endpoints
      url: https://monitoring-service:8080/api/q/health/live
    - title: Readiness Endpoints
      url: https://monitoring-service:8080/api/q/health/ready
    - title: Documentation
      url: https://code.ifg-life.id/projects/IFDA/repos/data-monitoring-service/browse/README.md
#    - title: Kafka Topic List
#      url: https://code.ifg-life.id/projects/IFDA/repos/data-base-service/browse/kafka-topics.md
#    - title: Sample Kafka Message
#      url: https://code.ifg-life.id/projects/IFDA/repos/data-base-service/browse/kafka-topics.md
spec:
  type: REST
  owner: group:data/data-access
  system: system:data/data-access-system
  domain: domain:data/data-platform
  lifecycle: production
  environments: prod
  language: java
  framework:
    - name: Quarkus
    - version: 3.29.3
  auth:
    method: API Key
    notes: >
      Service uses Kong API Key for authorization
  secretType: Kubernetes Secret
  security:
    rotationPolicy: manual
  runtime:
    cluster: cluster-data-prd
    namespace: data
  limits: 'default kong'
  dependsOn: [
    resource:default/eks-data-prd, #EKS 
    resource:infra/cluster-data-prd, #Cluster 
#    resource:infra/kafka-data, #Kafka
    resource:database/mongodb, #Database
    resource:database/aowf, #Database AO Workflow
    resource:database/automation, #Database Automation
    resource:database/epics-portal, #Database Epics Portal
    resource:database/ifgid, #Database IFG ID
    resource:database/ifgpay, #Database IFG Pay
    resource:database/lifeforce, #Database Life Force
    resource:database/onebyifg, #Database One By IFG
    resource:database/ifgaskes, #Database IFG ASKES
    resource:database/ifgebp, #Database IFG EBP
    resource:database/ifgnonebp, #Database IFG NON EBP
    resource:database/ifgretail, #Database IFG RETAIL
    resource:database/ifgfinance, #Database IFG FINANCE
    resource:data/kong #Gateway
  ]
  consumeApis: []
  providesApis: [
#    api:data/monitoring-service-api
  ]
  usesLibraries:
    - name: "rest-client"
      implemented: False