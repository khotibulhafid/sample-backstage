apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: data-bi-connector
  namespace: data
  title: Data BI Connector (Power BI – MongoDB)
  description: >
    Existing data access service that connects Power BI dashboards with
    MongoDB databases. The service acts as a read-only data integration
    layer for reporting and analytics purposes. The team is responsible
    for containerization, configuration, deployment, and operational support.
  tags:
    - data-platform
    - data-access
    - power-bi
    - mongodb
    - analytics
    - read-only
    - dockerized
    - dashboard
  links:
    - title: Source Repository
      url: https://code.ifg-life.id/projects/IFDA/repos/data-bi-connector/browse
    - title: Documentation
      url: https://www.mongodb.com/docs/bi-connector/current/
    - title: Monitoring / Logs (Datadog)
      url: https://app.datadoghq.com/apm/entity/service:data-bi-connector
    - title: Deployment (ArgoCD)
      url: https://deploy.ifg-life.id/applications/data-release-bi-connector?resource=
    - title: Docker Image
      url: docker://docker-data.artifact.ifg-life.id/job/data-bi-connector-release:16
    - title: Deployment YAML (Env & Config)
      url: https://code.ifg-life.id/projects/IFDE/repos/ifgl-m8ccz-prd-prod-graphdb-data-release/browse/deployment.yaml?at=refs%2Fheads%2Fbi-connector

spec:
  type: service
  lifecycle: production
  owner: group:data/data-access
  system: system:data/data-access-system
  domain: domain:data/data-platform
  environments:
    - uat
    - prod
  language: unknown
  framework:
    - name: mongodb
      version: 2.14.25
  auth:
    method: configuration-based
    notes: >
      Database access credentials are managed via mongodb atlas.

  secretType: Kubernetes Secret
  security:
    rotationPolicy: manual
  runtime:
    cluster: cluster-data-prd
    namespace: data
  dependsOn: [
    resource:default/eks-data-prd, #EKS
    resource:infra/cluster-data-prd, #Cluster
    resource:database/mongodb #Database
  ]
  providesApis: []
