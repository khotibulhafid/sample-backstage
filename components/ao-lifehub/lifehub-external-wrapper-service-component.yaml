---     
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: lifehub-external-wrapper-version2
  namespace: epics-portal
  description: consist of wrapping service from outside Automation cluster like IFGID, LifeForce, LifeSpace,  DigitalCare and LifeByIFG.
  tags:
    - backend
    - service
    - lifehub
    - wrapper
    - java
    - quarkus
  links:
    - title: Source Repository
    - url: https://code.ifg-life.id/projects/IFLH/repos/lifehub-external-wrapper-version2/browse
    - title: Monitoring / Logs (Datadog)
    - url: https://app.datadoghq.com/apm/entity/service:epics-portal-external-wrapper
    - title: Deployment (ArgoCD)
    - url: https://deploy.ifg-life.id/applications/argocd/epics-portal-release-lifehub-external-wrapper
    - title: Docker Image
    - url: docker://docker-automation-operation.artifact.ifg-life.id/epics-portal/lifehub-external-wrapper-release
    - title: Deployment YAML (Env & Config)
    - url: https://code.ifg-life.id/projects/IFDE/repos/ifgl-l4qdb-prd-prod-legacy-ao-epics-portal-release/browse/deployment.yaml?at=refs%2Fheads%2Flifehub-external-wrapper
    - title: Base URL
    - url: https://api-automation.ifg-life.id
    - title: Liveness Endpoints
    - url: https://epics-portal-external-wrapper:8080/lifehub/q/health/live
    - title: Readiness Endpoints
    - url: https://epics-portal-external-wrapper:8080/lifehub/q/health/ready
    - title: Documentation
    - url: https://code.ifg-life.id/projects/IFLH/repos/bulk-service-version2/browse/README.md
spec:
  type: REST
  domain: domain:channel/channel-platform
  owner: owner:channel/lifehub
  system: system:channel/lifehub-system
  lifecycle: production
  environments: prod
  language: java
  framework:
    - name: Quarkus
    - version: 3.24.3
  auth:
    method: ApiKey
    notes: >
      Service uses Kong Api Key for authorization
  secretType: Kubernetes Secret
  security:
    rotationPolicy: manual
  runtime:
    cluster: automation-prd
    namespace: epics-portal
  limits: 'default kong'
  providesApis: [lifehub-external-wrapper-service-api]
  dependsOn: [
    resource:default/prd-1awvh-prod-automation-az2, #Cluster
    resource:ao-workflow/ifgl-1awvh-prd-automation-db, #PostgreSQL DB
    resource:core/kong
  ]
  consumesApis: [
    ifgid/meta-service-api,
    lifeforce-individu/individu-new-business-service-api,
    customer/meta-service-api,
    customer/config-service-api,
    payment/core-service-api,
    payment/inquiry-core-service-api,
    ifgid/ekyc-service-api,
    ao-product-engine/product-config-service-api,
    ao-product-engine/product-calculator-service-api
  ]
