---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: admin-admin-service
  namespace: lifeforce-admin
  description: Service for managing admin from LifeForce Individual and LifeForce Group
  tags:
    - component
    - backend
    - service
    - lifeforce
    - lifeforce-admin
    - quarkus
links:
    - title: Source Repository
      url: https://code.ifg-life.id/projects/ILLF/repos/admin-admin-service/browse
    - title: Monitoring / Logs (Datadog)
      url: https://app.datadoghq.com/apm/entity/service:lifeforceadm-admin-service
    - title: Deployment (ArgoCD)
      url: https://deploy.ifg-life.id/applications/lifeforce-admin-release-admin-service
    - title: Docker Image
      url: docker://docker-lifeforce.artifact.ifg-life.id/lifeforce-admin/admin-service-release:48
    - title: Deployment YAML (Env & Config)
      url: https://code.ifg-life.id/projects/IFDE/repos/ifgl-yu30h-prd-prod-lifeforce-lifeforce-admin-release/browse/deployment.yaml?at=refs%2Fheads%2Fadmin-service
    - title: Base URL
      url: https://force-admin.life.id
    - title: Liveness Endpoints
      url: http://admin-service.lifeforce-admin.svc:8080/api/q/health/live
    - title: Readiness Endpoints
      url: http://admin-service.lifeforce-admin.svc:8080/api/q/health/ready
    - title: Kafka Topic List
      url: https://code.ifg-life.id/projects/ILLF/repos/admin-admin-service/kafka-topics.md
    - title: Documentation
      url: https://code.ifg-life.id/projects/ILLF/repos/admin-admin-service/browse/README.md
spec:
  type: REST
  owner: group:channel/lifeforce-admin
  system: system:channel/lifeforce-admin-system
  domain: domain:channel/channel-platform
  lifecycle: production
  environments: prod
  language: java
  framework:
    - name: Quarkus
    - version: 3.30.3
  auth:
    method: API Key
    notes: >
      Service uses Kong API Key for authorization
  secretType: Kubernetes Secret
  security:
    rotationPolicy: manual
  dependsOn: [
    resource:default/prd-lifeforce, #EKS 
    resource:infra/lifeforce-prd, #Cluster
    resource:database/pg-lifeforce, #Database
    resource:infra/kafka, #Kafka
    resource:lifeforce/kong, #Gateway
    resource:infra/redis
  ]
  runtime:
    cluster: lifeforce-prd
    namespace: lifeforce-admin
  providesApis: [lifeforce-admin/admin-admin-service-api]
  consumeApis: []
  limits: 'default kong'
