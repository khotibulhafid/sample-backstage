---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: product-post-validation-service
  namespace: ao-product-engine
  description: The services for validate calculate result and generate response.
  tags:
    - backend
    - service
    - product-post-validation
    - quarkus
  links:
      - title: Source Repository
        url: https://code.ifg-life.id/projects/IFPP/repos/post-validation-service/browse?at=refs%2Fheads%2Frelease
      - title: Monitoring / Logs (Datadog)
        url: https://app.datadoghq.com/apm/entity/service%3Acore-post-validation-service?dependencyMap.showNetworkMetrics=false&env=prd&groupMapByOperation=null&operationName=netty.request&start=1768448255367&end=1768451855367&paused=false
      - title: Deployment (ArgoCD)
        url: https://deploy.ifg-life.id/applications/ao-product-engine-release-post-validation-service
      - title: Deployment YAML (Env & Config)
        url: https://code.ifg-life.id/projects/IFDE/repos/ifgl-1awvh-prd-prod-automation-ao-product-engine-release/browse?at=refs%2Fheads%2Fpost-validation-service
      - title: Docker Image
        url: docker://docker-automation-operation.artifact.ifg-life.id/ao-product-engine/post-validation-service-release:7
      - title: Base URL
        url: https://api-core.ifg-life.id
      - title: Liveness Endpoints
        url: https://localhost:8080/api/q/health/live
      - title: Readiness Endpoints
        url: https://localhost:8080/api/q/health/ready
      - title: Documentation
        url: https://code.ifg-life.id/projects/IFPP/repos/post-validation-service/browse/README.md?at=refs%2Fheads%2Fuat
      - title: Kafka Documentation
        url: https://code.ifg-life.id/projects/IFPP/repos/post-validation-service/browse/DocumentationKafka.md?at=refs%2Fheads%2Fuat
spec:
  type: REST
  owner: group:core/product
  system: system:core/product-management-system
  domain: domain:core/core-business
  lifecycle: production
  environments: prod
  language: java
  framework:
    - name: Quarkus
    - version: 3.20.2
  auth:
    method: API Key
    notes: >
      Service uses Kong API Key for authorization
  secretType: Kubernetes Secret
  security:
    rotationPolicy: manual
  dependsOn: [
    resource:default/prd-automation, #EKS
    resource:infra/1awvh-prd-prod-automation-az2, #Cluster
    resource:database/pg-core, #Database
    resource:core-kong/kong, #Gateway
    resource:infra/kafka #Message Brocker
  ]
  runtime:
    cluster: 1awvh-prd-prod-automation-az2
    namespace: ao-product-engine
  consumeApis: [ ]
  limits: 'default kong'