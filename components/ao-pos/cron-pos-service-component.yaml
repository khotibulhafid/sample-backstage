---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: cron-pos-service
  namespace: ao-pos
  description: The cron pos service is service for running cron job ps
  tags:
  - backend
  - service
  - policy
  - ao-ps
  - ao-pos
  - cron
  - scheduler
  links:
    - title: Source Repository
      url: https://code.ifg-life.id/projects/IFPO/repos/cron-pos-service/browse
#    - title: Monitoring / Logs (Datadog)
#      url: ""
    - title: Deployment (ArgoCD)
      url: https://deploy.ifg-life.id/applications/ao-pos-release-cron-pos-service
    - title: Docker Image
      url: docker-automation-operation.artifact.ifg-life.id/ao-pos/cron-pos-service-release:latest
    - title: Deployment YAML (Env & Config)
      url: https://code.ifg-life.id/projects/IFCJ/repos/ifgl-prd-1awvh-pos-policy-service/browse
#    - title: Liveness Endpoints
#      url: http://pos-policy-service:8080/q/health/live
#    - title: Readiness Endpoints
#      url: http://pos-policy-service:8080/q/health/ready
    - title: Documentation
      url: https://code.ifg-life.id/projects/IFCJ/repos/ifgl-prd-1awvh-pos-policy-service/browse/README
#    - title: Base Url
#      url: https://api-core.ifg-life.id
spec:
  type: Scheduler
  owner: group:automation/policy-squad
  system: system:automation/policy-automation-support-system
  domain: domain:core/core-business
  lifecycle: production
  environment: prod
  language: shell script
  auth:
    method: none
  secretType: Kubernetes Secret
  security:
    rotationPolicy: manual
  runtime:
    cluster: 1awvh-prd-prod-automation-az2
    namespace: ao-pos
  dependsOn: [
    resource:default/prd-automation, # EKS
    resource:infra/1awvh-prd-prod-automation-az2, # Cluster
  ]
  providesApis: [ ]
  consumesApis: [ ]
  limits: '-'