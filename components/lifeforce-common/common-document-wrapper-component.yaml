---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: common-document-wrapper
  namespace: lifeforce-common
  description: Service for managing document for lifeforce
  tags:
    - component
    - backend
    - service
    - lifeforce
    - lifeforce-common
    - quarkus
links:
    - title: Source Repository
      url: https://code.ifg-life.id/projects/ILLF/repos/common-document-wrapper/browse
    - title: Monitoring / Logs (Datadog)
      url: https://app.datadoghq.com/apm/entity/service:lifeforcecommon-document-wrapper-service
    - title: Deployment (ArgoCD)
      url: https://deploy.ifg-life.id/applications/lifeforce-common-release-document-wrapper-service
    - title: Docker Image
      url: docker://docker-lifeforce.artifact.ifg-life.id/lifeforce-common/document-wrapper-service-release:11
    - title: Deployment YAML (Env & Config)
      url: https://code.ifg-life.id/projects/IFDE/repos/ifgl-yu30h-prd-prod-lifeforce-lifeforce-common-release/browse/deployment.yaml?at=refs%2Fheads%2Fdocument-wrapper-service
    - title: Base URL
      url: https://force.life.id
    - title: Liveness Endpoints
      url: http://document-wrapper-service.lifeforce-common.svc:8080/api/q/health/live
    - title: Readiness Endpoints
      url: http://document-wrapper-service.lifeforce-common.svc:8080/api/q/health/ready
    - title: Kafka Topic List
      url: https://code.ifg-life.id/projects/ILLF/repos/common-document-wrapper/kafka-topics.md
    - title: Documentation
      url: https://code.ifg-life.id/projects/ILLF/repos/common-document-wrapper/README.md
spec:
  type: REST
  owner: group:channel/lifeforce-common
  system: system:channel/lifeforce-common-system
  domain: domain:channel/channel-platform
  lifecycle: production
  environments: prod
  language: java
  framework:
    - name: Quarkus
    - version: 3.30.3
  auth:
    method: API Key
    notes: >
      Service uses Kong API Key for authorization
  secretType: Kubernetes Secret
  security:
    rotationPolicy: manual
  dependsOn: [
    resource:default/prd-lifeforce, #EKS 
    resource:infra/lifeforce-prd, #Cluster
    resource:infra/kafka, #Kafka
    resource:lifeforce/kong #Gateway
  ]
  runtime:
    cluster: lifeforce-prd
    namespace: lifeforce-common
  providesApis: [lifeforce-common/common-document-wrapper-api]
  consumeApis: []
  limits: 'default kong'
